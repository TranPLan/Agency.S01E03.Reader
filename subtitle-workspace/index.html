 mà.\\n[장 감독] \n저, CD… 아니, 상무님 \n[어색한 웃음]\n늦었지만 승진 축하드립니다\n내가 제작 본부장인데\\nCreative Director… I mean, Managing Director Go.\nIt's late, but congratulations.\nI'm the chief creative officer.","sourceUid":"merged-mr9a1bu8-56","uid":"merged-mr9a1bu8-56","sourceNo":83,"originalSourceNo":83,"manualOrder":48,"workspaceFixedOrder":48,"lockedOrder":48,"orderLocked":true,"start":380.526497,"end":393.496513,"viRange":{"start":384.440598,"end":393.496513},"koRange":{"start":380.526497,"end":389.40813},"viRanges":[{"start":384.440598,"end":393.496513}],"koRanges":[{"start":380.526497,"end":389.40813}]},{"id":48,"readerNo":49,"displayNo":49,"n":49,"cueNo":49,"uniqueCueNo":49,"finalCueNo":49,"originalDisplayNo":49,"type":"narration","vi":"Sao anh phải dè chừng quản lý sáng tạo?\nChuyện đó…\nVì tôi chỉ làm một năm?","ko":"왜 CD들 눈치를 보지?\n아, 그게…\n1년짜리니까?","en":"Why do you tiptoe around the creative directors?\nThat's because…\nBecause I'll only last a year?","text":"Sao anh phải dè chừng quản lý sáng tạo?\nChuyện đó…\nVì tôi chỉ làm một năm?\\n왜 CD들 눈치를 보지?\n아, 그게…\n1년짜리니까?\\nWhy do you tiptoe around the creative directors?\nThat's because…\nBecause I'll only last a year?","sourceUid":"merged-mr9a2yv0-57","uid":"merged-mr9a2yv0-57","sourceNo":78,"originalSourceNo":78,"manualOrder":49,"workspaceFixedOrder":49,"lockedOrder":49,"orderLocked":true,"start":389.40813,"end":399.957488,"viRange":{"start":393.496513,"end":399.957488},"koRange":{"start":389.40813,"end":396.066452},"viRanges":[{"start":393.496513,"end":399.957488}],"koRanges":[{"start":389.40813,"end":396.066452}]},{"id":49,"readerNo":50,"displayNo":50,"n":50,"cueNo":50,"uniqueCueNo":50,"finalCueNo":50,"originalDisplayNo":50,"type":"narration","vi":"Vì sau một năm, tôi sẽ trở thành\nĐạo diễn Jang thấy tôi hợp làm giáo sư hơn\ngiáo sư hoặc giám đốc công ty quảng cáo nhỏ?\nhay hợp làm giám đốc một công ty nhỏ hơn?","ko":"[아인] 1년 있다가 교수나 작은 대행사 대표로 갈 거니까?\n[한숨] 장 감독은 내가 교수가 어울릴 거 같아? 아님\n작은 대행사 대표가 어울릴 거 같아?","en":"Because I'll become a professor\nIn your opinion, am I more suited to be a professor\nor a CEO of a small agency in a year?\nor a CEO of a small agency?","text":"Vì sau một năm, tôi sẽ trở thành\nĐạo diễn Jang thấy tôi hợp làm giáo sư hơn\ngiáo sư hoặc giám đốc công ty quảng cáo nhỏ?\nhay hợp làm giám đốc một công ty nhỏ hơn?\\n[아인] 1년 있다가 교수나 작은 대행사 대표로 갈 거니까?\n[한숨] 장 감독은 내가 교수가 어울릴 거 같아? 아님\n작은 대행사 대표가 어울릴 거 같아?\\nBecause I'll become a professor\nIn your opinion, am I more suited to be a professor\nor a CEO of a small agency in a year?\nor a CEO of a small agency?","sourceUid":"merged-mr9a7zz7-61","uid":"merged-mr9a7zz7-61","sourceNo":79,"originalSourceNo":79,"manualOrder":50,"workspaceFixedOrder":50,"lockedOrder":50,"orderLocked":true,"start":396.066452,"end":414.515557,"viRange":{"start":399.957488,"end":414.515557},"koRange":{"start":396.066452,"end":411.08025},"viRanges":[{"start":399.957488,"end":414.515557}],"koRanges":[{"start":396.066452,"end":411.08025}]},{"id":50,"readerNo":51,"displayNo":51,"n":51,"cueNo":51,"uniqueCueNo":51,"finalCueNo":51,"originalDisplayNo":51,"type":"narration","vi":"Giám đốc Go, tôi không có ý đó.\nCái tính khí này mà dạy nổi sinh viên chắc?","ko":"상무님, 그런 뜻이 아니고요\n내 승질머리에 학교에서 애들 가르칠 수 있겠어?","en":"Ms. Go, that's not what I meant.\nDo you think I can teach kids with my temper?","text":"Giám đốc Go, tôi không có ý đó.\nCái tính khí này mà dạy nổi sinh viên chắc?\\n상무님, 그런 뜻이 아니고요\n내 승질머리에 학교에서 애들 가르칠 수 있겠어?\\nMs. Go, that's not what I meant.\nDo you think I can teach kids with my temper?","sourceUid":"merged-mr9afxyx-62","uid":"merged-mr9afxyx-62","sourceNo":94,"originalSourceNo":94,"manualOrder":51,"workspaceFixedOrder":51,"lockedOrder":51,"orderLocked":true,"start":411.08025,"end":419.632984,"viRange":{"start":414.515557,"end":419.632984},"koRange":{"start":411.08025,"end":415.390474},"viRanges":[{"start":414.515557,"end":419.632984}],"koRanges":[{"start":411.08025,"end":415.390474}]},{"id":51,"readerNo":52,"displayNo":52,"n":52,"cueNo":52,"uniqu ou.","sourceUid":"merged-mr9dbuqy-123","uid":"merged-mr9dbuqy-123","sourceNo":215,"originalSourceNo":215,"manualOrder":105,"workspaceFixedOrder":105,"lockedOrder":105,"orderLocked":true,"start":845.911004,"end":856.070411,"viRange":{"start":851.011356,"end":856.070411},"koRange":{"start":845.911004,"end":852.691248},"viRanges":[{"start":851.011356,"end":856.070411}],"koRanges":[{"start":845.911004,"end":852.691248}]},{"id":105,"readerNo":106,"displayNo":106,"n":106,"cueNo":106,"uniqueCueNo":106,"finalCueNo":106,"originalDisplayNo":106,"type":"narration","vi":"- [Âm nhạc thú vị] - [Cằn nhằn]","ko":"- [흥미로운 음악] - [씩씩거린다]","en":"- [Interesting music] - [Grunting]","text":"- [Âm nhạc thú vị] - [Cằn nhằn]\\n- [흥미로운 음악] - [씩씩거린다]\\n- [Interesting music] - [Grunting]","sourceUid":"ko-mr905eac-1087","uid":"ko-mr905eac-1087","sourceNo":216,"originalSourceNo":216,"manualOrder":106,"workspaceFixedOrder":106,"lockedOrder":106,"orderLocked":true,"start":880.04,"end":881.92,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":106,"readerNo":107,"displayNo":107,"n":107,"cueNo":107,"uniqueCueNo":107,"finalCueNo":107,"originalDisplayNo":107,"type":"narration","vi":"Này. Mẹ cháu đâu? Hả? Chừng nào mẹ mới đến?\nCậu ta không có mẹ. Không phải, tớ có mẹ! Có đâu mà có!","ko":"[여자] 얘. 너네 엄마 어디 있어? 응?\n엄마 언제 오냐고. 얘 엄마 없어\n아니야! 엄마 있어!\n[아이] 있긴 뭐가 있어","en":"Hey. Where's your mom?\nWhen is your mom coming? He doesn't have one.\nYes, I do! Stop lying!","text":"Này. Mẹ cháu đâu? Hả? Chừng nào mẹ mới đến?\nCậu ta không có mẹ. Không phải, tớ có mẹ! Có đâu mà có!\\n[여자] 얘. 너네 엄마 어디 있어? 응?\n엄마 언제 오냐고. 얘 엄마 없어\n아니야! 엄마 있어!\n[아이] 있긴 뭐가 있어\\nHey. Where's your mom?\nWhen is your mom coming? He doesn't have one.\nYes, I do! Stop lying!","sourceUid":"merged-mr9deti0-125","uid":"merged-mr9deti0-125","sourceNo":222,"originalSourceNo":222,"manualOrder":107,"workspaceFixedOrder":107,"lockedOrder":107,"orderLocked":true,"start":852.691248,"end":869.475141,"viRange":{"start":856.070411,"end":869.475141},"koRange":{"start":852.691248,"end":866.116463},"viRanges":[{"start":856.070411,"end":869.475141}],"koRanges":[{"start":852.691248,"end":866.116463}]},{"id":107,"readerNo":108,"displayNo":108,"n":108,"cueNo":108,"uniqueCueNo":108,"finalCueNo":108,"originalDisplayNo":108,"type":"narration","vi":"Tớ có bao giờ thấy mẹ cậu đến hội thi tài năng hay hội thao đâu!\nCậu làm gì có mẹ! Có đây! Mẹ xem nào.","ko":"재롱 잔치 때도 체육 대회 때도 한 번도 안 왔잖아\n엄마가 있긴 어디 있어!\n[은정] 여기 있어!","en":"She didn't come to the talent show or to Sports Day!\nYou don't have a mom! Yes, he does! Let me see.","text":"Tớ có bao giờ thấy mẹ cậu đến hội thi tài năng hay hội thao đâu!\nCậu làm gì có mẹ! Có đây! Mẹ xem nào.\\n재롱 잔치 때도 체육 대회 때도 한 번도 안 왔잖아\n엄마가 있긴 어디 있어!\n[은정] 여기 있어!\\nShe didn't come to the talent show or to Sports Day!\nYou don't have a mom! Yes, he does! Let me see.","sourceUid":"merged-mr9dghwj-126","uid":"merged-mr9dghwj-126","sourceNo":225,"originalSourceNo":225,"manualOrder":108,"workspaceFixedOrder":108,"lockedOrder":108,"orderLocked":true,"start":866.116463,"end":878.295801,"viRange":{"start":869.475141,"end":878.295801},"koRange":{"start":866.116463,"end":873.164631},"viRanges":[{"start":869.475141,"end":878.295801}],"koRanges":[{"start":866.116463,"end":873.164631}]},{"id":108,"readerNo":109,"displayNo":109,"n":109,"cueNo":109,"uniqueCueNo":109,"finalCueNo":109,"originalDisplayNo":109,"type":"narration","vi":"Chết tiệt. Cô là mẹ đây. Sao A Ji lại không có mẹ?\nMẹ A Ji. Tôi xin lỗi, nhưng chị…\nCô giáo, trông tôi có bình tĩnh nổi không? Không phải vậy.\nCô có thể cởi giày ra không?","ko":"봐 봐. 아이씨, 씨. 내가 엄마인데?\n우리 아지가 왜 엄마가 없어\n[교사] 아지 어머님 죄송한데 일단은…\n선생님, 제가 지금 진정하게 생겼어요?\n[교사] 아니, 그게 아니라. 저, 신발 좀…","en":"Darn it. I'm his mom. What do you mean he doesn't have a mom?\nMs. Cho. I'm sorry, but could you--\nDo you think I can calm down right now? That's not what I meant.\nCould you take your shoes off?","text":"Chết tiệt. Cô là mẹ đây. Sao A Ji lại không có mẹ?\nMẹ A Ji. Tôi xin lỗi, nhưng chị…\nCô giáo, trông tôi có bình tĩnh nổi không? Không phải vậy.\nCô có thể cởi giày ra không?\\n봐 봐. 아이씨, 씨. 내가 엄마인데?\n우리 아지가 왜 엄마가 없어\n[교사] 아지 어머님 죄송한데 일단은…\n선생님, 제가 지금 진정하게 생겼어요?\n[교사] 아니, 그게 아니라. 저, 신발 좀…\\nDarn it. I'm his mom. What do you mean he doesn't have a mom?\nMs. Cho. I'm sorry, but could you--\nDo you think I can calm down right now? That's not what I meant.\nCould you take your shoes off?","sourceUid":"merged-mr9djn2k-129","uid":"merged-mr9djn2k-129","sourceNo":233,"originalSourceNo":233,"manualOrder":109,"workspaceFixedOrder":109,"lockedOrder":109,"orderLocked":true,"start":873.164631,"end":893.058603,"viRange":{"start":878.295801,"end":893.058603},"koRange":{"start":873.164631,"end":889.694346},"viRanges":[{"start":878.295801,"end":893.058603}],"koRanges":[{"start":873.164631,"end":889.694346}]},{"id":109,"readerNo":110,"displayNo":110,"n":110,"cueNo":110,"uniqueCueNo":110,"finalCueNo":110,"originalDisplayNo":110,"type":"narration","vi":"[nhạc hài hước]\n[Người phụ nữ hết ho]","ko":"[익살스러운 음악]\n[여자의 헛기침]","en":"[humorous music]\n[Woman clears cough]","text":"[nhạc hài hước]\n[Người phụ nữ hết ho]\\n[익살스러운 음악]\n[여자의 헛기침]\\n[humorous music]\n[Woman clears cough]","sourceUid":"merged-mr9dkivb-130","uid":"merged-mr9dkivb-130","sourceNo":236,"originalSourceNo":236,"manualOrder":110,"workspaceFixedOrder":110,"lockedOrder":110,"orderLocked":true,"start":926.34,"end":927.42,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":110,"readerNo":111,"displayNo":111,"n":111,"cueNo":111,"uniqueCueNo":111,"finalCueNo":111,"originalDisplayNo":111,"type":"narration","vi":"Ôi trời.\nTrời ạ, thật tình.","ko":"[여자] 어머, 어머, 어머 아이, 진짜 [아지] 씨…","en":"Oh, my.\nGosh, seriously.","text":"Ôi trời.\nTrời ạ, thật tình.\\n[여자] 어머, 어머, 어머 아이, 진짜 [아지] 씨…\\nOh, my.\nGosh, seriously.","sourceUid":"merged-mr9dkzrj-131","uid":"merged-mr9dkzrj-131","sourceNo":239,"originalSourceNo":239,"manualOrder":111,"workspaceFixedOrder":111,"lockedOrder":111,"orderLocked":true,"sta 1,"end":963.768},"koRange":{"start":938.356944,"end":963.392971},"viRanges":[{"start":942.820681,"end":963.768}],"koRanges":[{"start":938.356944,"end":963.392971}]},{"id":113,"readerNo":114,"displayNo":114,"n":114,"cueNo":114,"uniqueCueNo":114,"finalCueNo":114,"originalDisplayNo":114,"type":"narration","vi":"[Âm thanh cảnh báo đèn giao thông] [Tiếng thở dài của Aji] [Âm thanh vận hành khóa cửa]\n[Giọng ngạc nhiên của Jungsook]","ko":"[신호등 알림음] [아지의 한숨][도어 록 작동음]\n[정숙의 놀란 소리]","en":"[Traffic light warning sound] [Aji's sigh] [Door lock operating sound]\n[Jungsook’s surprised voice]","text":"[Âm thanh cảnh báo đèn giao thông] [Tiếng thở dài của Aji] [Âm thanh vận hành khóa cửa]\n[Giọng ngạc nhiên của Jungsook]\\n[신호등 알림음] [아지의 한숨][도어 록 작동음]\n[정숙의 놀란 소리]\\n[Traffic light warning sound] [Aji's sigh] [Door lock operating sound]\n[Jungsook’s surprised voice]","sourceUid":"merged-muktause-1","uid":"merged-muktause-1","sourceNo":247,"originalSourceNo":247,"manualOrder":114,"workspaceFixedOrder":114,"lockedOrder":114,"orderLocked":true,"start":992.86,"end":994.24,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":114,"readerNo":115,"displayNo":115,"n":115,"cueNo":115,"uniqueCueNo":115,"finalCueNo":115,"originalDisplayNo":115,"type":"narration","vi":"Ôi trời ơi. Ai đánh lên mặt cún con của bà thế này? Con đánh nhau à?","ko":"[정숙] 아휴. 어머나, 웬일이야 \n[문 닫히는 소리] 아유! 아니, 우리 강아지 얼굴을 누가 이렇게 만들어 놨어\n[정호] 싸웠어?","en":"Goodness.\nWho did this to your face?\nDid you fight?","text":"Ôi trời ơi. Ai đánh lên mặt cún con của bà thế này? Con đánh nhau à?\\n[정숙] 아휴. 어머나, 웬일이야 \n[문 닫히는 소리] 아유! 아니, 우리 강아지 얼굴을 누가 이렇게 만들어 놨어\n[정호] 싸웠어?\\nGoodness.\nWho did this to your face?\nDid you fight?","sourceUid":"merged-mr9e4vmn-137","uid":"merged-mr9e4vmn-137","sourceNo":250,"originalSourceNo":250,"manualOrder":115,"workspaceFixedOrder":115,"lockedOrder":115,"orderLocked":true,"start":963.392971,"end":978.180871,"viRange":{"start":963.768,"end":978.180871},"koRange":{"start":963.392971,"end":973.484957},"viRanges":[{"start":963.768,"end":978.180871}],"koRanges":[{"start":963.392971,"end":973.484957}]},{"id":115,"readerNo":116,"displayNo":116,"n":116,"cueNo":116,"uniqueCueNo":116,"finalCueNo":116,"originalDisplayNo":116,"type":"narration","vi":"Thắng hay thua? Cái thằng… A Ji, nói chuyện với mẹ đi.\nA Ji, nói chuyện với mẹ đi.\nNói chuyện với mẹ đi mà.","ko":"이겼어, 졌어?\n[도어 록 작동음]\n[은정] 아지야, 엄마랑 얘기 좀 해\n아지야, 엄마랑 얘기 좀 해 - [문 닫히는 소리]\n엄마랑 얘기 좀 해","en":"Did you win or lose? Why you… A-ji, let's talk. A-ji, talk to me. Talk to me, please.","text":"Thắng hay thua? Cái thằng… A Ji, nói chuyện với mẹ đi.\nA Ji, nói chuyện với mẹ đi.\nNói chuyện với mẹ đi mà.\\n이겼어, 졌어?\n[도어 록 작동음]\n[은정] 아지야, 엄마랑 얘기 좀 해\n아지야, 엄마랑 얘기 좀 해 - [문 닫히는 소리]\n엄마랑 얘기 좀 해\\nDid you win or lose? Why you… A-ji, let's talk. A-ji, talk to me. Talk to me, please.","sourceUid":"merged-mr9e6pyu-140","uid":"merged-mr9e6pyu-140","sourceNo":254,"originalSourceNo":254,"manualOrder":116,"workspaceFixedOrder":116,"lockedOrder":116,"orderLocked":true,"start":973.484957,"end":984.938915,"viRange":{"start":978.180871,"end":984.938915},"koRange":{"start":973.484957,"end":984.356679},"viRanges":[{"start":978.180871,"end":984.938915}],"koRanges":[{"start":973.484957,"end":984.356679}]},{"id":116,"readerNo":117,"displayNo":117,"n":117,"cueNo":117,"uniqueCueNo":117,"finalCueNo":117,"originalDisplayNo":117,"type":"narration","vi":"Không thích. Mẹ ra đi.\nCon không có mẹ. Mẹ không phải mẹ con.\nMẹ là mẹ quảng cáo.\nRa đi. Mẹ đi đi.","ko":"[아지가 울며] 싫어, 나가! 나 엄마 없어! 우리 엄마 아니야, 광고 엄마야. 나가, 나가! [울음]","en":"I don't want to. Go away.\nI don't have a mom. You're not my mom.\nYou're an advertisement mom.\nGo away. Get out.","text":"Không thích. Mẹ ra đi.\nCon không có mẹ. Mẹ không phải mẹ con.\nMẹ là mẹ quảng cáo.\nRa đi. Mẹ đi đi.\\n[아지가 울며] 싫어, 나가! 나 엄마 없어! 우리 엄마 아니야, 광고 엄마야. 나가, 나가! [울음]\\nI don't want to. Go away.\nI don't have a mom. You're not my mom.\nYou're an advertisement mom.\nGo away. Get out.","sourceUid":"me 정","en":"Aren't you coming?\nEveryone is waiting for you.\nWe're all waiting, Ms. Cho!\n-Please join us! -Cho Eun-jeong.\n-Cho Eun-jeong. -Cho Eun-jeong.\nHurry up and come!","text":"Chị không đến sao? Mọi người đang đợi chị đấy. Chúng tôi muốn gặp cô! - Cô mau đến đi! - Cho Eun Jeong. - Cho Eun Jeong. - Cho Eun Jeong. Mau đến đi!\\n아, 카피님 안 오실 거예요? 다들 카피님 찾아요, 어? \n[직원1] 카피님, 보고 싶어요! \n[장우] 조은정 \n[직원2] 빨리 오세요! \n[직원들] 조은정, 조은정 \n[한숨] 조은정\\nAren't you coming?\nEveryone is waiting for you.\nWe're all waiting, Ms. Cho!\n-Please join us! -Cho Eun-jeong.\n-Cho Eun-jeong. -Cho Eun-jeong.\nHurry up and come!","sourceUid":"merged-mr9eikr3-145","uid":"merged-mr9eikr3-145","sourceNo":229,"originalSourceNo":229,"manualOrder":122,"workspaceFixedOrder":122,"lockedOrder":122,"orderLocked":true,"start":1044,"end":1060.17938,"viRange":{"start":1047,"end":1060.17938},"koRange":{"start":1044,"end":1054.966493},"viRanges":[{"start":1047,"end":1060.17938}],"koRanges":[{"start":1044,"end":1054.966493}]},{"id":122,"readerNo":123,"displayNo":123,"n":123,"cueNo":123,"uniqueCueNo":123,"finalCueNo":123,"originalDisplayNo":123,"type":"narration","vi":"Em lại phải ra ngoài à? \nMau đến đi! Mau đến đi! Mau đến đi!","ko":"[직원3] 빨리 와라! 또 나가야 돼? \n[직원들] 빨리 와. 빨리 와, 빨리 와","en":"Do you have to go out again? Hurry up. Hurry up. Hurry up.","text":"Em lại phải ra ngoài à? \nMau đến đi! Mau đến đi! Mau đến đi!\\n[직원3] 빨리 와라! 또 나가야 돼? \n[직원들] 빨리 와. 빨리 와, 빨리 와\\nDo you have to go out again? Hurry up. Hurry up. Hurry up.","sourceUid":"merged-mr9epksl-146","uid":"merged-mr9epksl-146","sourceNo":236,"originalSourceNo":236,"manualOrder":123,"workspaceFixedOrder":123,"lockedOrder":123,"orderLocked":true,"start":1054.966493,"end":1067.537415,"viRange":{"start":1060.17938,"end":1067.537415},"koRange":{"start":1054.966493,"end":1064.747029},"viRanges":[{"start":1060.17938,"end":1067.537415}],"koRanges":[{"start":1054.966493,"end":1064.747029}]},{"id":123,"readerNo":124,"displayNo":124,"n":124,"cueNo":124,"uniqueCueNo":124,"finalCueNo":124,"originalDisplayNo":124,"type":"narration","vi":"[Nhân viên hét lên 'Hãy đến nhanh!']","ko":"[직원들이 '빨리 와'를 외친다]","en":"[Employees shout ‘Come quickly!’]","text":"[Nhân viên hét lên 'Hãy đến nhanh!']\\n[직원들이 '빨리 와'를 외친다]\\n[Employees shout ‘Come quickly!’]","sourceUid":"ko-mr905ead-1153","uid":"ko-mr905ead-1153","sourceNo":282,"originalSourceNo":282,"manualOrder":124,"workspaceFixedOrder":124,"lockedOrder":124,"orderLocked":true,"start":1087.5,"end":1091.54,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":124,"readerNo":125,"displayNo":125,"n":125,"cueNo":125,"uniqueCueNo":125,"finalCueNo":125,"originalDisplayNo":125,"type":"narration","vi":"Bọn trẻ lớn nhanh lắm. Sau này, dù có muốn chơi với chúng thì chúng cũng chạy đi chơi với bạn cơ. Con nghĩ kỹ đi.","ko":"[정숙이 한숨 쉬며] 나 애 금방 커 \n[정숙] 나중엔 같이 있고 싶어도 친구가 더 좋다고 도망간다 잘 생각해 봐라","en":"Kids grow up quickly.\nThey'll soon choose their friends over you even if you want to spend time with them.\nThink carefully.","text":"Bọn trẻ lớn nhanh lắm. Sau này, dù có muốn chơi với chúng thì chúng cũng chạy đi chơi với bạn cơ. Con nghĩ kỹ đi.\\n[정숙이 한숨 쉬며] 나 애 금방 커 \n[정숙] 나중엔 같이 있고 싶어도 친구가 더 좋다고 도망간다 잘 생각해 봐라\\nKids grow up quickly.\nThey'll soon choose their friends over you even if you want to spend time with them.\nThink carefully.","sourceUid":"merged-mr9eufe6-148","uid":"merged-mr9eufe6-148","sourceNo":283,"originalSourceNo":283,"manualOrder":125,"workspaceFixedOrder":125,"lockedOrder":125,"orderLocked":true,"start":1099.293782,"end":1115.842899,"viRange":{"start":1099.293782,"end":1115.842899},"koRange":{"start":1100.172226,"end":1111.476215},"viRanges":[{"start":1099.293782,"end":1115.842899}],"koRanges":[{"start":1100.172226,"end":1111.476215}]},{"id":125,"readerNo":126,"displayNo":126,"n":126,"cueNo":126,"uniqueCueNo":126,"finalCueNo":126,"originalDisplayNo":126,"type":"narration","vi":"Mẹ không xem phim cẩu huyết.\nNào là sóng gió gia đình, mâu thuẫn mẹ chồng nàng dâu,\nnào là xen vào việc dạy con.\nMẹ ghét nhất thể loại đó.\nCon cũng biết mà.","ko":"나 막장 드라마 안 본다.\n여자가 어쩌니 저쩌니.\n고부 갈등에 자식 문제에 감 놔라, 배 놔라. \n아 나 그런 거 딱 별로야 \n저도 알아요","en":"You know, I don't watch soap operas.\nI hate the whole drama between a mother-in-law and daughter-in-law\nand fighting over children's matters.\nI despise it. I know.","text":"Mẹ không xem phim cẩu huyết.\nNào là sóng gió gia đình, mâu thuẫn mẹ chồng nàng dâu,\nnào là xen vào việc dạy con.\nMẹ ghét nhất thể loại đó.\nCon cũng biết mà.\\n나 막장 드라마 안 본다.\n여자가 어쩌니 저쩌니.\n고부 갈등에 자식 문제에 감 놔라, 배 놔라. \n아 나 그런 거 딱 별로야 \n저도 알아요\\nYou know, I don't watch soap operas.\nI hate the whole drama between a mother-in-law and daughter-in-law\nand fighting over children's matters.\nI despise it. I know.","sourceUid":"merged-mr9erau6-147","uid":"merged-mr9erau6-147","sourceNo":288,"originalSourceNo":288,"manualOrder":126,"workspaceFixedOrder":126,"lockedOrder":126,"orderLocked":true,"start":1076,"end":1099.293782,"viRange":{"start":1081,"end":1099.293782},"koRange":{"start":1076,"end":1093.801432},"viRanges":[{"start":1081,"end":1099.293782}],"koRanges":[{"start":1076,"end":1093.801432}]},{"id":126,"readerNo":127,"displayNo":127,"n":127,"cueNo":127,"uniqueCueNo":127,"finalCueNo":127,"originalDisplayNo":127,"type":"narration","vi":"[Tiếng mở cửa]\n[Âm nhạc êm dịu]\n[Thở dài của Eunjeong]","ko":"[문 열리는 소리]\n[차분한 음악]\n[은정의 한숨]","en":"[Sound of door opening]\n[Calm music]\n[Eunjeong’s sigh]","text":"[Tiếng mở cửa]\n[Âm nhạc êm dịu]\n[Thở dài của Eunjeong]\\n[문 열리는 소리]\n[차분한 음악]\n[은정의 한숨]\\n[Sound of door opening]\n[Calm music]\n[Eunjeong’s sigh]","sourceUid":"merged-mra27hml-2","uid":"merged-mra27hml-2","sourceNo":293,"originalSourceNo":293,"manualOrder":127,"workspaceFixedOrder":127,"lockedOrder":127,"orderLocked":true,"start":1140.26,"end":1141.68,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":127,"readerNo":128,"displayNo":128,"n":128,"cueNo":128,"uniqueCueNo":128,"finalCueNo":128,"originalDisplayNo":128,"type":"narration","vi":"Cả em, anh và A Ji đều mệt mỏi. \nEm định làm việc quên giờ về, quên cả cuối tuần như vậy đến bao giờ? Hại sức khỏe lắm. \nCũng chẳng to tát như việc nước.","ko":"[정호] 너도 나도 아지도 \n다 힘들잖아 \n언제까지 그렇게 퇴근도 주말도 없이 일하려고 \n몸 상하면서 나라 지키는 일도 아닌데","en":"You, me, and A-ji are all suffering. \nUntil when are you going to keep devoting your life to work? \nIt's not healthy for you. \nIt's not like you're a soldier.","text":"Cả em, anh và A Ji đều mệt mỏi. \nEm định làm việc quên giờ về, quên cả cuối tuần như vậy đến bao giờ? Hại sức khỏe lắm. \nCũng chẳng to tát như việc nước.\\n[정호] 너도 나도 아지도 \n다 힘들잖아 \n언제까지 그렇게 퇴근도 주말도 없이 일하려고 \n몸 상하면서 나라 지키는 일도 아닌데\\nYou, me, and A-ji are all suffering. \nUntil when are you going to keep devoting your life to work? \nIt's not healthy for you. \nIt's not like you're a soldier.","sourceUid":"merged-mr9evve6-149","uid":"merged-mr9evve6-149","sourceNo":250,"originalSourceNo":250,"manualOrder":128,"workspaceFixedOrder":128,"lockedOrder":128,"orderLocked":true,"start":1115.843,"end":1142.319413,"viRange":{"start":1115.843,"end":1142.319413},"koRange":{"start":1122.714277,"end":1138.155},"viRanges":[{"start":1115.843,"end":1142.319413}],"koRanges":[{"start":1122.714277,"end":1138.155}]},{"id":128,"readerNo":129,"displayNo":129,"n":129,"cueNo":129,"uniqueCueNo":129,"finalCueNo":129,"originalDisplayNo":129,"type":"narration","vi":"Eun Jeong à.\nAnh nghĩ đây là vấn đề mà em cần quyết định.","ko":"은정아 네가 결심해야 되는 문제인 거 같아","en":"Eun-jeong.\nI think you have to be really determined to make a decision.","text":"Eun Jeong à.\nAnh nghĩ đây là vấn đề mà em cần quyết định.\\n은정아 네가 결심해야 되는 문제인 거 같아\\nEun-jeong.\nI think you have to be really determined to make a decision.","sourceUid":"merged-mra2jl9j-3","uid":"merged-mra2jl9j-3","sourceNo":303,"originalSourceNo":303,"manualOrder":129,"workspaceFixedOrder":129,"lockedOrder":129,"orderLocked":true,"start":1142.319,"end":1153.640522,"viRange":{"start":1142.319,"end":1153.640522},"koRange":{"star ":"merged-mra3vy47-22","sourceNo":360,"originalSourceNo":360,"manualOrder":156,"workspaceFixedOrder":156,"lockedOrder":156,"orderLocked":true,"start":1421,"end":1437.918851,"viRange":{"start":1424,"end":1437.918851},"koRange":{"start":1421,"end":1432.207682},"viRanges":[{"start":1424,"end":1437.918851}],"koRanges":[{"start":1421,"end":1432.207682}]},{"id":156,"readerNo":157,"displayNo":157,"n":157,"cueNo":157,"uniqueCueNo":157,"finalCueNo":157,"originalDisplayNo":157,"type":"narration","vi":"[Âm thanh xấu hổ của Yongho]","ko":"[용호의 당황한 소리]","en":"[Yongho’s embarrassed sound]","text":"[Âm thanh xấu hổ của Yongho]\\n[용호의 당황한 소리]\\n[Yongho’s embarrassed sound]","sourceUid":"ko-mr905ead-1239","uid":"ko-mr905ead-1239","sourceNo":368,"originalSourceNo":368,"manualOrder":157,"workspaceFixedOrder":157,"lockedOrder":157,"orderLocked":true,"start":1476.76,"end":1478.72,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":157,"readerNo":158,"displayNo":158,"n":158,"cueNo":158,"uniqueCueNo":158,"finalCueNo":158,"originalDisplayNo":158,"type":"narration","vi":"Bố, chào mọi người đi. Ai đấy? Công chúng.\nNày, phải là ông Chung chứ làm gì có ai tên ông Chúng.\nBố có quen ông Chúng nào đâu. Ai cơ?\nCô ấy nói là \"công chúng\" ạ.\nXin chào, tôi là Kang Yong Ho.","ko":"아빠, 인사해. 누구신데?. 대중\n야, 그 어르신 돌아가신 지 한참 됐어\n[용호] 대통령 퇴임하시고\n[한나] 누…\n[태완] 일반 시민들입니다. 안녕하세요, 강용호입니다","en":"Dad, say hello. Who are they? The public.\nWhat do you mean by public? We're in a private area right now.\nThis is our house. What?\nShe means public as in people.\nHello, my name is Kang Yong-ho.","text":"Bố, chào mọi người đi. Ai đấy? Công chúng.\nNày, phải là ông Chung chứ làm gì có ai tên ông Chúng.\nBố có quen ông Chúng nào đâu. Ai cơ?\nCô ấy nói là \"công chúng\" ạ.\nXin chào, tôi là Kang Yong Ho.\\n아빠, 인사해. 누구신데?. 대중\n야, 그 어르신 돌아가신 지 한참 됐어\n[용호] 대통령 퇴임하시고\n[한나] 누…\n[태완] 일반 시민들입니다. 안녕하세요, 강용호입니다\\nDad, say hello. Who are they? The public.\nWhat do you mean by public? We're in a private area right now.\nThis is our house. What?\nShe means public as in people.\nHello, my name is Kang Yong-ho.","sourceUid":"merged-mra404cy-24","uid":"merged-mra404cy-24","sourceNo":369,"originalSourceNo":369,"manualOrder":158,"workspaceFixedOrder":158,"lockedOrder":158,"orderLocked":true,"start":1432.207682,"end":1458.935,"viRange":{"start":1437.918851,"end":1458.935},"koRange":{"start":1432.207682,"end":1454.006802},"viRanges":[{"start":1437.918851,"end":1458.935}],"koRanges":[{"start":1432.207682,"end":1454.006802}]},{"id":158,"readerNo":159,"displayNo":159,"n":159,"cueNo":159,"uniqueCueNo":159,"finalCueNo":159,"originalDisplayNo":159,"type":"narration","vi":"KẾT THÚC PHÁT TRỰC TIẾP?\nĐÃ KẾT THÚC","ko":"","en":"END THE LIVESTREAM?\nLIVESTREAM ENDED","text":"KẾT THÚC PHÁT TRỰC TIẾP?\nĐÃ KẾT THÚC\\nEND THE LIVESTREAM?\nLIVESTREAM ENDED","sourceUid":"merged-mra42nli-26","uid":"merged-mra42nli-26","sourceNo":319,"originalSourceNo":319,"manualOrder":159,"workspaceFixedOrder":159,"lockedOrder":159,"orderLocked":true,"start":1464.586577,"end":1468.863017,"viRange":{"start":1464.586577,"end":1468.863017},"koRange":null,"viRanges":[{"start":1464.586577,"end":1468.863017}],"koRanges":[]},{"id":159,"readerNo":160,"displayNo":160,"n":160,"cueNo":160,"uniqueCueNo":160,"finalCueNo":160,"originalDisplayNo":160,"type":"narration","vi":"Mọi người đừng sống buông thả và phí phạm mà hãy tiết kiệm nhé.\nTạm biệt.","ko":"다들 욜로 그런 거 하다 골로 가지 마시고 \n[한나] 아끼면서 사세요, 안녕","en":"Don't waste your life YOLO-ing it\nand stay frugal. Goodbye.","text":"Mọi người đừng sống buông thả và phí phạm mà hãy tiết kiệm nhé.\nTạm biệt.\\n다들 욜로 그런 거 하다 골로 가지 마시고 \n[한나] 아끼면서 사세요, 안녕\\nDon't waste your life YOLO-ing it\nand stay frugal. Goodbye.","sourceUid":"merged-mra42fgb-25","uid":"merged-mra42fgb-25","sourceNo":371,"originalSourceNo":371,"manualOrder":160,"workspaceFixedOrder":160,"lockedOrder":160,"orderLocked":true,"start":1454.006802,"end":1464.586577,"viRange":{"start":1458.935,"end":1464.586577},"koRange":{"start":1454.006802,"end":1460.221042},"viRanges":[{"start":1458.935,"end":1464.586577}],"koRanges":[{"start":1454.006802,"end":1460.221042}]},{"id":160,"readerNo":161,"displayNo":161,"n":161,"cueNo":161,"uniqueCueNo":161,"finalCueNo":161,"originalDisplayNo":161,"type":"narration","vi":"Này! Con dám biến bố thành trò cười quốc dân à?\nTịch thu máy nó. Trợ lý Park! - Có.\nChạy đi! Kang Han Na! Trợ lý Park nữa!","ko":"[용호] 야! 너 아빠를 국가적인 웃음거리로 만들고. 쟤 핸드폰 저거 뺏어\n[한나] 어, 박 차장!\n[영우] 네. 튀어, 튀어, 튀어. 야, 강한나!\n[용호] 박 차장 너…","en":"Hey! You just made me a fool in front of the public. Confiscate her phone. Mr. Park! Yes. Run! Kang Han-na! And you!","text":"Này! Con dám biến bố thành trò cười quốc dân à?\nTịch thu máy nó. Trợ lý Park! - Có.\nChạy đi! Kang Han Na! Trợ lý Park nữa!\\n[용호] 야! 너 아빠를 국가적인 웃음거리로 만들고. 쟤 핸드폰 저거 뺏어\n[한나] 어, 박 차장!\n[영우] 네. 튀어, 튀어, 튀어. 야, 강한나!\n[용호] 박 차장 너…\\nHey! You just made me a fool in front of the public. Confiscate her phone. Mr. Park! Yes. Run! Kang Han-na! And you!","sourceUid":"merged-mra44gis-28","uid":"merged-mra44gis-28","sourceNo":377,"originalSourceNo":377,"manualOrder":161,"workspaceFixedOrder":161,"lockedOrder":161,"orderLocked":true,"start":1460.221042,"end":1484.275075,"viRange":{"start":1468.863017,"end":1484.275075},"koRange":{"start":1460.221042,"end":1479.622324},"viRanges":[{"start":1468.863017,"end":1484.275075}],"koRanges":[{"start":1460.221042,"end":1479.622324}]},{"id":161,"readerNo":162,"displayNo":162,"n":162,"cueNo":162,"uniqueCueNo":162,"finalCueNo":162,"originalDisplayNo":162,"type":"narration","vi":"Xin lỗi Chủ tịch. Sao cậu lại để nó… Thôi, bỏ đi.","ko":"[당황한 소리] 죄송합니다, 회장님 쟤 저대로 정말… \n[용호] 아휴, 아니다","en":"My apologies, sir. How could you let her… Never mind.","text":"Xin lỗi Chủ tịch. Sao cậu lại để nó… Thôi, bỏ đi.\\n[당황한 소리] 죄송합니다, 회장님 쟤 저대로 정말… \n[용호] 아휴, 아니다\\nMy apologies, sir. How could you let her… Never mind.","sourceUid":"merged-mra468z7-29","uid":"merged-mra468z7-29","sourceNo":380,"originalSourceNo":380,"manualOrder":162,"workspaceFixedOrder":162,"lockedOrder":162,"orderLocked":true,"start":1479.622324,"end":1491.473427,"viRange":{"start":1484.275075,"end":1491.473427},"koRange":{"start":1479.622324,"end":1486.443084},"viRanges":[{"start":1484.275075,"end":1491.473427}],"koRanges":[{"start":1479.622324,"end":1486.443084}]},{"id":162,"readerNo":163,"displayNo":163,"n":163,"cueNo":163,"uniqueCueNo":163,"finalCueNo":163,"originalDisplayNo":163,"type":"narration","vi":"[Tiếng thở dài của Rồng Hổ]","ko":"[용호의 한숨]","en":"[Dragon Tiger's Sigh]","text":"[Tiếng thở dài của Rồng Hổ]\\n[용호의 한숨]\\n[Dragon Tiger's Sigh]","sourceUid":"ko-mr905ead-1253","uid":"ko-mr905ead-1253","sourceNo":382,"originalSourceNo":382,"manualOrder":163,"workspaceFixedOrder":163,"lockedOrder":163,"orderLocked":true,"start":1516.55,"end":1517.8,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":163,"readerNo":164,"displayNo":164,"n":164,"cueNo":164,"uniqueCueNo":164,"finalCueNo":164,"originalDisplayNo":164,"type":"narration","vi":"Đến tôi còn chẳng cản được nó nữa là. Vậy tôi xin phép. Này. Vâng.","ko":"나도 못 말리는데 네가 무슨 힘으로\n저, 그럼 가 보겠습니다 야 \n[영우] 네?","en":"Even I can't keep her under control.\nI'll get going, sir. Hey. Yes, sir.","text":"Đến tôi còn chẳng cản được nó nữa là. Vậy tôi xin phép. Này. Vâng.\\n나도 못 말리는데 네가 무슨 힘으로\n저, 그럼 가 보겠습니다 야 \n[영우] 네?\\nEven I can't keep her under control.\nI'll get going, sir. Hey. Yes, sir.","sourceUid":"merged-mra47gy9-30","uid":"merged-mra47gy9-30","sourceNo":384,"originalSourceNo":384,"manualOrder":164,"workspaceFixedOrder":164,"lockedOrder":164,"orderLocked":true,"start":1486.443084,"end":1499.141832,"viRange":{"start":1491.473427,"end":1499.141832},"koRange":{"start":1486.443084,"end":1494.961922},"viRanges":[{"start":1491.473427,"end":1499.141832}],"koRanges":[{"start":1486.443084,"end":1494.961922}]},{"id":164,"readerNo":165,"displayNo":165,"n":165,"cueNo":165,"uniqueCueNo":165,"finalCueNo":165,"originalDisplayNo":165,"type":"narration","vi":"Cậu chịu nổi không? Tôi thăng chức cho cậu nhé?\nMau lên đi! Bố bắt được là bị chửi điếc luôn đó!","ko":"버틸 만해? 승진시켜 줄까? 아, 빨리 와!\n[한나] 아빠한테 잡히면 귀에서 피 난다니까?","en":"How are you holding up? Do you want a promotion? Mr. Park, come here!\nDad will nag you until your ears bleed out.","text":"Cậu chịu nổi không? Tôi thăng chức cho cậu nhé?\nMau lên đi! Bố bắt được là bị chửi điếc luôn đó!\\n버틸 만해? 승진시켜 줄까? 아, 빨리 와!\n[한나] 아빠한테 잡히면 귀에서 피 난다니까?\\nHow are you holding up? Do you want a promotion? Mr. Park, come here!\nDad will nag you until your ears bleed out.","sourceUid":"merged-mra4vfbb-32","uid":"merged-mra4vfbb-32","sourceNo":387,"originalSourceNo":387,"manualOrder":165,"workspaceFixedOrder":165,"lockedOrder":165,"orderLocked":true,"start":1494.961922,"end":1505.85945,"viRange":{"start":1499.141832,"end":1505.85945},"koRange":{"start":1494.961922,"end":1500.592761},"viRanges":[{"start":1499.141832,"end":1505.85945}],"koRanges":[{"start":1494.961922,"end":1500.592761}]},{"id":165,"readerNo":166,"displayNo":166,"n":166,"cueNo":166,"uniqueCueNo":166,"finalCueNo":166,"originalDisplayNo":166,"type":"narration","vi":"[Âm thanh ngạc nhiên]","ko":"[놀란 소리]","en":"[Sound of surprise]","text":"[Âm thanh ngạc nhiên]\\n[놀란 소리]\\n[Sound of surprise]","sourceUid":"ko-mr905ead-1259","uid":"ko-mr905ead-1259","sourceNo":388,"originalSourceNo":388,"manualOrder":166,"workspaceFixedOrder":166,"lockedOrder":166,"orderLocked":true,"start":1529.27,"end":1530.27,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":166,"readerNo":167,"displayNo":167,"n":167,"cueNo":167,"uniqueCueNo":167,"finalCueNo":167,"originalDisplayNo":167,"type":"narration","vi":"Này. Vâng, Chủ tịch. Tôi dám đảm bảo với cậu là con bé đó kiểu gì cũng gây chuyện. Thế nên là… - Vâng.\nChỉ cần làm sao để thân thể nó không bị thương thôi.","ko":"[용호] 야 \n[영우] 네, 회장님\n[용호] 내가 장담하는데 저거 사고 친다, 반드시 그니까 \n[영우] 네. 몸만 성하게 안 다치게 하라고","en":"Hey. Yes, sir. I'm certain that she'll cause more trouble.\nSo just… Yes, sir.\nKeep her from hurting herself.","text":"Này. Vâng, Chủ tịch. Tôi dám đảm bảo với cậu là con bé đó kiểu gì cũng gây chuyện. Thế nên là… - Vâng.\nChỉ cần làm sao để thân thể nó không bị thương thôi.\\n[용호] 야 \n[영우] 네, 회장님\n[용호] 내가 장담하는데 저거 사고 친다, 반드시 그니까 \n[영우] 네. 몸만 성하게 안 다치게 하라고\\nHey. Yes, sir. I'm certain that she'll cause more trouble.\nSo just… Yes, sir.\nKeep her from hurting herself.","sourceUid":"merged-mra4ytdc-34","uid":"merged-mra4ytdc-34","sourceNo":390,"originalSourceNo":390,"manualOrder":167,"workspaceFixedOrder":167,"lockedOrder":167,"orderLocked":true,"start":1500.592761,"end":1519.413491,"viRange":{"start":1505.85945,"end":1519.413491},"koRange":{"start":1500.592761,"end":1513.981967},"viRanges":[{"start":1505.85945,"end":1519.413491}],"koRanges":[{"start":1500.592761,"end":1513.981967}]},{"id":167,"readerNo":168,"displayNo":168,"n":168,"cueNo":168,"uniqueCueNo":168,"finalCueNo":168,"originalDisplayNo":168,"type":"narration","vi":"Còn đầu nó hết thuốc chữa rồi.\nCon bé điên. Nó giống ai không biết?\nCòn ai vào đây nữa? Giống bố chứ ai.","ko":"이건 어쩔 수 없고. \n아유, 저 미친 아, 저게 누굴 닮아서, 참. [근철] 닮긴 누굴 닮니? 나 닮았디","en":"Her mind is beyond help.\nThat lunatic. Who does she take after?\nWho do you think? She takes after me.","text":"Còn đầu nó hết thuốc chữa rồi.\nCon bé điên. Nó giống ai không biết?\nCòn ai vào đây nữa? Giống bố chứ ai.\\n이건 어쩔 수 없고. \n아유, 저 미친 아, 저게 누굴 닮아서, 참. [근철] 닮긴 누굴 닮니? 나 닮았디\\nHer mind is beyond help.\nThat lunatic. Who does she take after?\nWho do you think? She takes after me.","sourceUid":"merged-mra5062w-35","uid":"merged-mra5062w-35","sourceNo":397,"originalSourceNo":397,"manualOrder":168,"workspaceFixedOrder":168,"lockedOrder":168,"orderLocked":true,"start":1513.981967,"end":1535.042567,"viRange":{"start":1519.413491,"end":1535.042567},"koRange":{"start":1513.981967,"end":1530.059898},"viRanges":[{"start":1519.413491,"end":1535.042567}],"koRanges":[{"start":1513.981967,"end":1530.059898}]},{"id":168,"readerNo":169,"displayNo":169,"n":169,"cueNo":169,"uniq ges":[{"start":2166.168428,"end":2173.465299}]},{"id":213,"readerNo":214,"displayNo":214,"n":214,"cueNo":214,"uniqueCueNo":214,"finalCueNo":214,"originalDisplayNo":214,"type":"narration","vi":"Ai cũng biết tôi chỉ được làm giám đốc một năm.\nĐám người chảnh chọe theo phe giám đốc Choi trong đợt tuyển dụng công khai sẽ nghe lời tôi chắc?","ko":"1년짜리 본부장인 걸 다 아는데\n머리 굵은 최 상무 라인인\n공채 출신 부장급들에게 내 말이 먹히겠냐고","en":"Everyone knows I'll be gone in a year.\nMr. Choi's big-headed managers\nfrom open recruitment won't listen to a word I say.","text":"Ai cũng biết tôi chỉ được làm giám đốc một năm.\nĐám người chảnh chọe theo phe giám đốc Choi trong đợt tuyển dụng công khai sẽ nghe lời tôi chắc?\\n1년짜리 본부장인 걸 다 아는데\n머리 굵은 최 상무 라인인\n공채 출신 부장급들에게 내 말이 먹히겠냐고\\nEveryone knows I'll be gone in a year.\nMr. Choi's big-headed managers\nfrom open recruitment won't listen to a word I say.","sourceUid":"merged-mradkr8z-5","uid":"merged-mradkr8z-5","sourceNo":530,"originalSourceNo":530,"manualOrder":214,"workspaceFixedOrder":214,"lockedOrder":214,"orderLocked":true,"start":2119.863878,"end":2187.324709,"viRange":{"start":2119.863878,"end":2134.225435},"koRange":{"start":2173.465299,"end":2187.324709},"viRanges":[{"start":2119.863878,"end":2134.225435}],"koRanges":[{"start":2173.465299,"end":2187.324709}]},{"id":214,"readerNo":215,"displayNo":215,"n":215,"cueNo":215,"uniqueCueNo":215,"finalCueNo":215,"originalDisplayNo":215,"type":"narration","vi":"Anh nghĩ tôi có thể làm cùng họ sao?\nAnh nói đội sáng tạo sẽ bị chia ra, nhỉ?","ko":"얘네들 데리고 일 제대로 할 수 있겠어?\n[한숨] 제작 팀 둘로 쪼개진다고 했지?","en":"You think I can work with these guys?\nYou said the team will be divided, right?","text":"Anh nghĩ tôi có thể làm cùng họ sao?\nAnh nói đội sáng tạo sẽ bị chia ra, nhỉ?\\n얘네들 데리고 일 제대로 할 수 있겠어?\n[한숨] 제작 팀 둘로 쪼개진다고 했지?\\nYou think I can work with these guys?\nYou said the team will be divided, right?","sourceUid":"merged-mradljil-6","uid":"merged-mradljil-6","sourceNo":532,"originalSourceNo":532,"manualOrder":215,"workspaceFixedOrder":215,"lockedOrder":215,"orderLocked":true,"start":2134.225435,"end":2195.084369,"viRange":{"start":2134.225435,"end":2142.034386},"koRange":{"start":2187.324709,"end":2195.084369},"viRanges":[{"start":2134.225435,"end":2142.034386}],"koRanges":[{"start":2187.324709,"end":2195.084369}]},{"id":215,"readerNo":216,"displayNo":216,"n":216,"cueNo":216,"uniqueCueNo":216,"finalCueNo":216,"originalDisplayNo":216,"type":"narration","vi":"Đúng vậy. Không có bọn họ, sẽ có vị trí trống.\nTôi sẽ thăng chức cho các nhân sự được mời về.\nRồi họ sẽ đứng về phía tôi.\nChia để trị.","ko":"예. [아인] 얘네들 밀어내면 새로운 자리 생길 거고\n그 자리에 비공채 출신들 승진시키면\n걔넨 다 내 편이야. 디바이드 앤 룰","en":"Yes. Without them, their seats will be vacant. I'll give their seats to the target-recruited employees. Then they'll be on my side.","text":"Đúng vậy. Không có bọn họ, sẽ có vị trí trống.\nTôi sẽ thăng chức cho các nhân sự được mời về.\nRồi họ sẽ đứng về phía tôi.\nChia để trị.\\n예. [아인] 얘네들 밀어내면 새로운 자리 생길 거고\n그 자리에 비공채 출신들 승진시키면\n걔넨 다 내 편이야. 디바이드 앤 룰\\nYes. Without them, their seats will be vacant. I'll give their seats to the target-recruited employees. Then they'll be on my side.","sourceUid":"merged-mradofbo-8","uid":"merged-mradofbo-8","sourceNo":535,"originalSourceNo":535,"manualOrder":216,"workspaceFixedOrder":216,"lockedOrder":216,"orderLocked":true,"start":2142.034386,"end":2211.421569,"viRange":{"start":2142.034386,"end":2157.922988},"koRange":{"start":2195.084369,"end":2211.421569},"viRanges":[{"start":2142.034386,"end":2157.922988}],"koRanges":[{"start":2195.084369,"end":2211.421569}]},{"id":216,"readerNo":217,"displayNo":217,"n":217,"cueNo":217,"uniqueCueNo":217,"finalCueNo":217,"originalDisplayNo":217,"type":"narration","vi":"Nếu không thể chiếm lấy tất cả, ít ra cũng phải nắm được phân nửa.","ko":"다 못 가질 거면 절반이라도 확실하게 가져야겠지?","en":"If you can't have everything, you have to take half.","text":"Nếu không thể chiếm lấy tất cả, ít ra cũng phải nắm được phân nửa.\\n다 못 가질 거면 절반이라도 확실하게 가져야겠지?\\nIf you can't have everything, you have to take half.","sourceUid":"merged-mradpzlz-9","uid":"merged-mradpzlz-9","sourceNo":539,"originalSourceNo":539,"manualOrder":217,"workspaceFixedOrder":217,"lockedOrder":217,"orderLocked":true,"start":2157.922988,"end":2215.903039,"viRange":{"start":2157.922988,"end":2161.983668},"koRange":{"start":2211.421569,"end":2215.903039},"viRanges":[{"start":2157.922988,"end":2161.983668}],"koRanges":[{"start":2211.421569,"end":2215.903039}]},{"id":217,"readerNo":218,"displayNo":218,"n":218,"cueNo":218,"uniqueCueNo":218,"finalCueNo":218,"originalDisplayNo":218,"type":"narration","vi":"[Âm nhạc ý nghĩa]","ko":"[의미심장한 음악]","en":"[Meaningful music]","text":"[Âm nhạc ý nghĩa]\\n[의미심장한 음악]\\n[Meaningful music]","sourceUid":"ko-mr905eae-1409","uid":"ko-mr905eae-1409","sourceNo":538,"originalSourceNo":538,"manualOrder":218,"workspaceFixedOrder":218,"lockedOrder":218,"orderLocked":true,"start":2180.3,"end":2181.51,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":218,"readerNo":219,"displayNo":219,"n":219,"cueNo":219,"uniqueCueNo":219,"finalCueNo":219,"originalDisplayNo":219,"type":"narration","vi":"Nghe tàn nhẫn quá. Chỉ có độc tài mới làm cách đó.","ko":"너무 잔인한 거 아닙니까?\n독재자들이 쓰는 그런 방법…","en":"This is just too cruel. This is what dictators do.","text":"Nghe tàn nhẫn quá. Chỉ có độc tài mới làm cách đó.\\n너무 잔인한 거 아닙니까?\n독재자들이 쓰는 그런 방법…\\nThis is just too cruel. This is what dictators do.","sourceUid":"merged-mradriu1-10","uid":"merged-mradriu1-10","sourceNo":541,"originalSourceNo":541,"manualOrder":219,"workspaceFixedOrder":219,"lockedOrder":219,"orderLocked":true,"start":2161.983668,"end":2221.912403,"viRange":{"start":2161.983668,"end":2167.922189},"koRange":{"start":2215.903039,"end":2221.912403},"viRanges":[{"start":2161.983668,"end":2167.922189}],"koRanges":[{"start":2215.903039,"end":2221.912403}]},{"id":219,"readerNo":220,"displayNo":220,"n":220,"cueNo":220,"uniqueCueNo":220,"finalCueNo":220,"originalDisplayNo":220,"type":"narration","vi":"Anh thấy sư tử săn hươu là một việc tàn nhẫn sao?\nAnh phải làm mọi thứ để sinh tồn.","ko":"사자가 사슴 잡아먹는다고 잔인하다고 하나?\n생존을 위해선 뭐든지 하는 거야","en":"Do you say it's cruel when a lion hunts a deer down?\nYou need to do everything to survive.","text":"Anh thấy sư tử săn hươu là một việc tàn nhẫn sao?\nAnh phải làm mọi thứ để sinh tồn.\\n사자가 사슴 잡아먹는다고 잔인하다고 하나?\n생존을 위해선 뭐든지 하는 거야\\nDo you say it's cruel when a lion hunts a deer down?\nYou need to do everything to survive.","sourceUid":"merged-mradsbqc-11","uid":"merged-mradsbqc-11","sourceNo":543,"originalSourceNo":543,"manualOrder":220,"workspaceFixedOrder":220,"lockedOrder":220,"orderLocked":true,"start":2167.922189,"end":2227.35458,"viRange":{"start":2167.922189,"end":2174.121917},"koRange":{"start":2221.912403,"end":2227.35458},"viRanges":[{"start":2167.922189,"end":2174.121917}],"koRanges":[{"start":2221.912403,"end":2227.35458}]},{"id":220,"readerNo":221,"displayNo":221,"n":221,"cueNo":221,"uniqueCueNo":221,"finalCueNo":221,"originalDisplayNo":221,"type":"narration","vi":"Nếu vậy… Được rồi.\nCứ cho là cô đã thuyết phục được ban giám đốc và biến điều không thể thành có thể.\nNhưng nếu tổng giám đốc từ chối?\nKhông có chuyện đó đâu.","ko":"[병수] 그러면. 자, 좋아요\n임원들 다 설득했다고 해도 뭐, 물론 그것도 어렵겠지만\n만약에 대표님이 거절하시면요?\n그럴 리 없어","en":"Then… Fine. Let's assume you convinced all the executives\nand made the impossible possible.\nWhat if the CEO refuses?\nThat won't happen.","text":"Nếu vậy… Được rồi.\nCứ cho là cô đã thuyết phục được ban giám đốc và biến điều không thể thành có thể.\nNhưng nếu tổng giám đốc từ chối?\nKhông có chuyện đó đâu.\\n[병수] 그러면. 자, 좋아요\n임원들 다 설득했다고 해도 뭐, 물론 그것도 어렵겠지만\n만약에 대표님이 거절하시면요?\n그럴 리 없어\\nThen… Fine. Let's assume you convinced all the executives\nand made the impossible possible.\nWhat if the CEO refuses?\nThat won't happen.","sourceUid":"merged-mraduev9-14","uid":"merged-mraduev9-14","sourceNo":549,"originalSourceNo":549,"manualOrder":221,"workspaceFixedOrder":221,"lockedOrder":221,"orderLocked":true,"start":2174.121917,"end":2244.726009,"viRange":{"start":2174.121917,"end":2191.553935},"koRange":{"start":2227.35458,"end":2244.726009},"viRanges":[{"start":2174.121917,"end":2191.553935}],"koRanges":[{"start":2227.35458,"end":2244.726009}]},{"id":221,"readerNo":222,"displayNo":222,"n":222,"cueNo":222,"uniqueCueNo":222,"finalCueNo":222,"originalDisplayNo":222,"type":"narration","vi":"Tôi sẽ đề xuất một chuyện mà ông ấy không thể từ chối. PHÊ DUYỆT TÀI LIỆU","ko":"거절하지 못할 제안을 할 거니까","en":"I'm going to offer him something he won't be able to refuse.\nDOCUMENT APPROVED","text":"Tôi sẽ đề xuất một chuyện mà ông ấy không thể từ chối. PHÊ DUYỆT TÀI LIỆU\\n거절하지 못할 제안을 할 거니까\\nI'm going to offer him something he won't be able to refuse.\nDOCUMENT APPROVED","sourceUid":"merged-mradvauk-16","uid":"merged-mradvauk-16","sourceNo":479,"originalSourceNo":479,"manualOrder":222,"workspaceFixedOrder":222,"lockedOrder":222,"orderLocked":true,"start":2191.553935,"end":2249.574338,"viRange":{"start":2191.553935,"end":2201.119833},"koRange":{"start":2244.726009,"end":2249.574338},"viRanges":[{"start":2191.553935,"end":2201.119833}],"koRanges":[{"start":2244.726009,"end":2249.574338}]},{"id":222,"readerNo":223,"displayNo":223,"n":223,"cueNo":223,"uniqueCueNo":223,"finalCueNo":223,"originalDisplayNo":223,"type":"narration","vi":"Hôm nay anh nghỉ phép đi.\nAnh phải về nhà thì tôi mới yên tâm tiến hành vụ này.","ko":"[아인] 넌 오늘 월차 내고 들어가\n네가 집에 가 있어야지 내가 마음 편히 진행할 수 있어","en":"Take the day off today. You need to be home so I can proceed with this in peace.","text":"Hôm nay anh nghỉ phép đi.\nAnh phải về nhà thì tôi mới yên tâm tiến hành vụ này.\\n[아인] 넌 오늘 월차 내고 들어가\n네가 집에 가 있어야지 내가 마음 편히 진행할 수 있어\\nTake the day off today. You need to be home so I can proceed with this in peace.","sourceUid":"merged-mradvw19-17","uid":"merged-mradvw19-17","sourceNo":552,"originalSourceNo":552,"manualOrder":223,"workspaceFixedOrder":223,"lockedOrder":223,"orderLocked":true,"start":2209,"end":2268.852635,"viRange":{"start":2209,"end":2214.986677},"koRange":{"start":2263,"end":2268.852635},"viRanges":[{"start":2209,"end":2214.986677}],"koRanges":[{"start":2263,"end":2268.852635}]},{"id":223,"readerNo":224,"displayNo":224,"n":224,"cueNo":224,"uniqueCueNo":224,"finalCueNo":224,"originalDisplayNo":224,"type":"narration","vi":"[Âm thanh thao tác nút]","ko":"[버튼 조작음]","en":"[Button operation sound]","text":"[Âm thanh thao tác nút]\\n[버튼 조작음]\\n[Button operation sound]","sourceUid":"ko-mr905eae-1424","uid":"ko-mr905eae-1424","sourceNo":553,"originalSourceNo":553,"manualOrder":224,"workspaceFixedOrder":224,"lockedOrder":224,"orderLocked":true,"start":2243.36,"end":2244.24,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":224,"readerNo":225,"displayNo":225,"n":225,"cueNo":225,"uniqueCueNo":225,"finalCueNo":225,"originalDisplayNo":225,"type":"narration","vi":"Ôi, Đội phó Han. Ừ, cô đến rồi à.\nĐêm qua anh thức trắng sao?\nĐã xảy ra chuyện gì vậy?\nKhông, mà sắp có chuyện rồi đấy.","ko":"[은정] 어, 부장님 응, 왔어? \n[은정] 날 샜어요? 뭔 일 터졌어요? \n[하품하며] 아니 뭔 일 이제 곧 터질 거야","en":"Hey, Mr. Han. Hey, you're here.\nDid you stay up? Did something happen?\nNo, but it's about to.","text":"Ôi, Đội phó Han. Ừ, cô đến rồi à.\nĐêm qua anh thức trắng sao?\nĐã xảy ra chuyện gì vậy?\nKhông, mà sắp có chuyện rồi đấy.\\n[은정] 어, 부장님 응, 왔어? \n[은정] 날 샜어요? 뭔 일 터졌어요? \n[하품하며] 아니 뭔 일 이제 곧 터질 거야\\nHey, Mr. Han. Hey, you're here.\nDid you stay up? Did something happen?\nNo, but it's about to.","sourceUid":"merged-mradzx8n-18","uid":"merged-mradzx8n-18","sourceNo":559,"originalSourceNo":559,"manualOrder":225,"workspaceFixedOrder":225,"lockedOrder":225,"orderLocked":true,"start":2228,"end":2293.831,"viRange":{"start":2228,"end":2240.086846},"koRange":{"start":2282,"end":2293.831},"viRanges":[{"start":2228,"end":2240.086846}],"koRanges":[{"start":2282,"end":2293.831}]},{"id":225,"readerNo":226,"displayNo":226,"n":226,"cueNo":226,"uniqueCueNo":226,"finalCueNo":226,"originalDisplayNo":226,"ty  I can't.","sourceUid":"merged-mragjqzx-35","uid":"merged-mragjqzx-35","sourceNo":599,"originalSourceNo":599,"manualOrder":243,"workspaceFixedOrder":243,"lockedOrder":243,"orderLocked":true,"start":2354.474008,"end":2417.974654,"viRange":{"start":2354.474008,"end":2364.131849},"koRange":{"start":2407.119301,"end":2417.974654},"viRanges":[{"start":2354.474008,"end":2364.131849}],"koRanges":[{"start":2407.119301,"end":2417.974654}]},{"id":243,"readerNo":244,"displayNo":244,"n":244,"cueNo":244,"uniqueCueNo":244,"finalCueNo":244,"originalDisplayNo":244,"type":"narration","vi":"Vậy thì… Anh triệu tập họp ban giám đốc đi.\nHọp ban giám đốc sao? Cô nghĩ họ sẽ chấp thuận à?","ko":"[아인] 그럼 임원 회의 소집해 주세요\n임원 회의요? \n이게 통과될 거 같으세요?","en":"Then… Please arrange a board meeting. A board meeting? You think they'll approve?","text":"Vậy thì… Anh triệu tập họp ban giám đốc đi.\nHọp ban giám đốc sao? Cô nghĩ họ sẽ chấp thuận à?\\n[아인] 그럼 임원 회의 소집해 주세요\n임원 회의요? \n이게 통과될 거 같으세요?\\nThen… Please arrange a board meeting. A board meeting? You think they'll approve?","sourceUid":"merged-mragl9pk-36","uid":"merged-mragl9pk-36","sourceNo":604,"originalSourceNo":604,"manualOrder":244,"workspaceFixedOrder":244,"lockedOrder":244,"orderLocked":true,"start":2365,"end":2432.211138,"viRange":{"start":2365,"end":2379.033272},"koRange":{"start":2417.974654,"end":2432.211138},"viRanges":[{"start":2365,"end":2379.033272}],"koRanges":[{"start":2417.974654,"end":2432.211138}]},{"id":244,"readerNo":245,"displayNo":245,"n":245,"cueNo":245,"uniqueCueNo":245,"finalCueNo":245,"originalDisplayNo":245,"type":"narration","vi":"[Âm nhạc ý nghĩa]","ko":"[의미심장한 음악]","en":"[Meaningful music]","text":"[Âm nhạc ý nghĩa]\\n[의미심장한 음악]\\n[Meaningful music]","sourceUid":"ko-mr905eae-1473","uid":"ko-mr905eae-1473","sourceNo":602,"originalSourceNo":602,"manualOrder":245,"workspaceFixedOrder":245,"lockedOrder":245,"orderLocked":true,"start":2394.26,"end":2395.55,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id": D들 인사는\n이해합니다, 솔직히 말씀드릴게요\n뭐, 다들 알지만 쉬쉬한 문제였죠 안 그렇습니까?\n[임원1] 뭐, 그러려니 했지만\\nRegarding the demotion of creative directors, I completely understand. I'll be frank.\nWe knew about their misconduct but swept it under the rug.\nYes, we let them slide.","sourceUid":"merged-mrakohh0-56","uid":"merged-mrakohh0-56","sourceNo":555,"originalSourceNo":555,"manualOrder":257,"workspaceFixedOrder":257,"lockedOrder":257,"orderLocked":true,"start":2557.568938,"end":2622.901648,"viRange":{"start":2557.568938,"end":2569.155695},"koRange":{"start":2611.364535,"end":2622.901648},"viRanges":[{"start":2557.568938,"end":2569.155695}],"koRanges":[{"start":2611.364535,"end":2622.901648}]},{"id":257,"readerNo":258,"displayNo":258,"n":258,"cueNo":258,"uniqueCueNo":258,"finalCueNo":258,"originalDisplayNo":258,"type":"narration","vi":"Thấy họ bị phạt như vậy, chúng tôi hả hê lắm.\nĐúng thế. Tôi cũng vậy.","ko":"[임원2] 저희도 속은 좀 시원했습니다\n[재무 상무] 네, 저도요","en":"We were glad they were taught a lesson.\nRight. Same here.","text":"Thấy họ bị phạt như vậy, chúng tôi hả hê lắm.\nĐúng thế. Tôi cũng vậy.\\n[임원2] 저희도 속은 좀 시원했습니다\n[재무 상무] 네, 저도요\\nWe were glad they were taught a lesson.\nRight. Same here.","sourceUid":"merged-mrakp2gz-57","uid":"merged-mrakp2gz-57","sourceNo":652,"originalSourceNo":652,"manualOrder":258,"workspaceFixedOrder":258,"lockedOrder":258,"orderLocked":true,"start":2569.155695,"end":2628.208955,"viRange":{"start":2569.155695,"end":2574.527827},"koRange":{"start":2622.901648,"end":2628.208955},"viRanges":[{"start":2569.155695,"end":2574.527827}],"koRanges":[{"start":2622.901648,"end":2628.208955}]},{"id":258,"readerNo":259,"displayNo":259,"n":259,"cueNo":259,"uniqueCueNo":259,"finalCueNo":259,"originalDisplayNo":259,"type":"narration","vi":"Nhưng việc này thì không được.\nĐối xử với người tuyển công khai kiểu đó\nthì còn ai trung thành nữa?\nTrung thành?","ko":"[기호] 하지만 이건 아니죠, 어?\n공채들 이렇게 천대하면\n누가 회사에 충성심을 보이겠습니까?\n[헛웃음] 충성심이라…","en":"But this is going too far.\nIf we treat our openly
