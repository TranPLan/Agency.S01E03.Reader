?","text":"nên công ty mới ra nông nỗi này. Cô nói \"nông nỗi này\" là sao?\nChúng ta đứng đầu ngành kia mà.\nCô hơi quá lời rồi đấy. Tôi quá lời sao?\\n[기호] 상무님, 이 꼴이라니요\n[임원1] 업계 1위인데 무슨\n말씀이 과하시네요. 과하다고요?\\nor they were part of the open recruitment.\nWhat do you mean \"grim state\"?\nWe're the best in the field.\nAren't you being too harsh? Too harsh?","sourceUid":"merged-mrakv3u3-62","uid":"merged-mrakv3u3-62","sourceNo":668,"originalSourceNo":668,"manualOrder":263,"workspaceFixedOrder":263,"lockedOrder":263,"orderLocked":true,"start":2604.139689,"end":2665.688881,"viRange":{"start":2604.139689,"end":2612.112841},"koRange":{"start":2657.268745,"end":2665.688881},"viRanges":[{"start":2604.139689,"end":2612.112841}],"koRanges":[{"start":2657.268745,"end":2665.688881}]},{"id":263,"readerNo":264,"displayNo":264,"n":264,"cueNo":264,"uniqueCueNo":264,"finalCueNo":264,"originalDisplayNo":264,"type":"dialogue","vi":"Đội phó Cha Seong Woo.\nHỒ SƠ NHÂN SỰ TÊN: CHA SEONG WOO\nĐỘI SÁNG TẠO 3 CHỈ ĐẠO SÁNG TẠO CHA SEONG WOO\nCậu viết nốt cái này rồi mai nộp lại nhé.\nLỜI DẪN NGẮN CHÚC MỪNG CÔ DÂU VÀ CHÚ RỂ","ko":"[아인] 차성우 부장\n[차 부장] 이거 내일까지 써 가지고 줘","en":"Manager Cha Seong-woo.\nPERSONNEL RECORDS NAME: CHA SEONG-WOO\nCREATIVE TEAM 3 CHA SEONG-WOO\nFinish writing this up by tomorrow.\nSHORT LINES ON CONGRATULATING THE BRIDE AND GROOM'S FUTURE","text":"Đội phó Cha Seong Woo.\nHỒ SƠ NHÂN SỰ TÊN: CHA SEONG WOO\nĐỘI SÁNG TẠO 3 CHỈ ĐẠO SÁNG TẠO CHA SEONG WOO\nCậu viết nốt cái này rồi mai nộp lại nhé.\nLỜI DẪN NGẮN CHÚC MỪNG CÔ DÂU VÀ CHÚ RỂ\\n[아인] 차성우 부장\n[차 부장] 이거 내일까지 써 가지고 줘\\nManager Cha Seong-woo.\nPERSONNEL RECORDS NAME: CHA SEONG-WOO\nCREATIVE TEAM 3 CHA SEONG-WOO\nFinish writing this up by tomorrow.\nSHORT LINES ON CONGRATULATING THE BRIDE AND GROOM'S FUTURE","sourceUid":"merged-mrakxasj-65","uid":"merged-mrakxasj-65","sourceNo":671,"originalSourceNo":671,"manualOrder":264,"workspaceFixedOrder":264,"lockedOrder":264,"orderLocked":true,"start":2618,"end":2685.599904,"viRange":{"start":2618,"end":2632.436106},"koRange":{"start":2672,"end":2685.599904},"viRanges":[{"start":2618,"end":2632.436106}],"koRanges":[{"start":2672,"end":2685.599904}]},{"id":264,"readerNo":265,"displayNo":265,"n":265,"cueNo":265,"uniqueCueNo":265,"finalCueNo":265,"originalDisplayNo":265,"type":"narration","vi":"[âm nhạc đen tối]","ko":"[어두운 음악]","en":"[dark music]","text":"[âm nhạc đen tối]\\n[어두운 음악]\\n[dark music]","sourceUid":"ko-mr905eae-1541","uid":"ko-mr905eae-1541","sourceNo":670,"originalSourceNo":670,"manualOrder":265,"workspaceFixedOrder":265,"lockedOrder":265,"orderLocked":true,"start":2642.05,"end":2644.3,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":265,"readerNo":266,"displayNo":266,"n":266,"cueNo":266,"uniqueCueNo":266,"finalCueNo":266,"originalDisplayNo":266,"type":"narration","vi":"Gì vậy ạ? Thiệp cưới của khách hàng.\nTôi đang bận việc khác. Còn cô làm cái này.\nĐây là ảnh cưới của họ.\nChỉnh sửa ảnh cho đẹp vào, giống quảng cáo làm đẹp ấy.\nSao tôi lại phải làm việc này?\nKhách hàng sắp kết hôn đó.\nCó thế cũng không làm nổi à?","ko":"[직원1] 이거 뭔데요? 광고주 청첩장\n아, 지금 다른 건 때문에 바쁜데…\n그리고 너는 그거 웨딩 전 사진이니까 예쁘게 포토샵 해 가지고 뷰티 광고 포스터처럼 만들어\n그걸 왜 제가 왜…\n광고주가 결혼한다잖아\n[차 부장] 그 정도도 못 해?","en":"What's this? A client's wedding invitation.\nI have another project I'm working on. -And for you.\nIt's their wedding studio photos.\nPhotoshop them to look like beauty ad posters.\nWhy do I have to do this?\nThe client is getting married. Can't you do it?","text":"Gì vậy ạ? Thiệp cưới của khách hàng.\nTôi đang bận việc khác. Còn cô làm cái này.\nĐây là ảnh cưới của họ.\nChỉnh sửa ảnh cho đẹp vào, giống quảng cáo làm đẹp ấy.\nSao tôi lại phải làm việc này?\nKhách hàng sắp kết hôn đó.\nCó thế cũng không làm nổi à?\\n[직원1] 이거 뭔데요? 광고주 청첩장\n아, 지금 다른 건 때문에 바쁜데…\n그리고 너는 그거 웨딩 전 사진이니까 예쁘게 포토샵 해 가지고 뷰티 광고 포스터처럼 만들어\n그걸 왜 제가 왜…\n광고주가 결혼한다잖아\n[차 부장] 그 정도도 못 해?\\nWhat's this? A client's wedding invitation.\nI have another project I'm working on. -And for you.\nIt's their wedding studio photos.\nPhotoshop them to look like beauty ad posters.\nWhy do I have to do this?\nThe client is getting married. Can't you do it?","sourceUid":"merged-mral89ja-67","uid":"merged-mral89ja-67","sourceNo":680,"originalSourceNo":680,"manualOrder":266,"workspaceFixedOrder":266,"lockedOrder":266,"orderLocked":true,"start":2632.436106,"end":2705.766794,"viRange":{"start":2632.436106,"end":2653.099346},"koRange":{"start":2685.599904,"end":2705.766794},"viRanges":[{"start":2632.436106,"end":2653.099346}],"koRanges":[{"start":2685.599904,"end":2705.766794}]},{"id":266,"readerNo":267,"displayNo":267,"n":267,"cueNo":267,"uniqueCueNo":267,"finalCueNo":267,"originalDisplayNo":267,"type":"narration","vi":"Vâng, Đội trưởng.\nAnh chuẩn bị lễ cưới đến đâu rồi?\nKhông, không sao đâu.","ko":"아, 예, 팀장님 [웃음]\n결혼 준비는 잘되시죠?\n아유, 아유, 아, 아닙니다, 네","en":"Hello, sir.\nHow's the wedding planning going?\nNo, it's nothing, sir.","text":"Vâng, Đội trưởng.\nAnh chuẩn bị lễ cưới đến đâu rồi?\nKhông, không sao đâu.\\n아, 예, 팀장님 [웃음]\n결혼 준비는 잘되시죠?\n아유, 아유, 아, 아닙니다, 네\\nHello, sir.\nHow's the wedding planning going?\nNo, it's nothing, sir.","sourceUid":"merged-mral9x56-68","uid":"merged-mral9x56-68","sourceNo":683,"originalSourceNo":683,"manualOrder":267,"workspaceFixedOrder":267,"lockedOrder":267,"orderLocked":true,"start":2653.099346,"end":2714.496052,"viRange":{"start":2653.099346,"end":2661.281478},"koRange":{"start":2705.766794,"end":2714.496052},"viRanges":[{"start":2653.099346,"end":2661.281478}],"koRanges":[{"start":2705.766794,"end":2714.496052}]},{"id":267,"readerNo":268,"displayNo":268,"n":268,"cueNo":268,"uniqueCueNo":268,"finalCueNo":268,"originalDisplayNo":268,"type":"narration","vi":"Không có năng lực, nhưng muốn giữ chân khách hàng,\nnên anh ta đã bắt cả đội làm đủ thứ vặt vãnh.","ko":"[아인] 실력은 없는데 광고주는 잡아야 되니까\n별 지저분한 일들 다 시키고\n그러다 보니","en":"He didn't want to lose his clients despite his incompetence,\nso he made his team members do all the dirty work.","text":"Không có năng lực, nhưng muốn giữ chân khách hàng,\nnên anh ta đã bắt cả đội làm đủ thứ vặt vãnh.\\n[아인] 실력은 없는데 광고주는 잡아야 되니까\n별 지저분한 일들 다 시키고\n그러다 보니\\nHe didn't want to lose his clients despite his incompetence,\nso he made his team members do all the dirty work.","sourceUid":"merged-mralbamp-69","uid":"merged-mralbamp-69","sourceNo":686,"originalSourceNo":686,"manualOrder":268,"workspaceFixedOrder":268,"lockedOrder":268,"orderLocked":true,"start":2661.281478,"end":2724.393573,"viRange":{"start":2661.281478,"end":2672.267419},"koRange":{"start":2714.496052,"end":2724.393573},"viRanges":[{"start":2661.281478,"end":2672.267419}],"koRanges":[{"start":2714.496052,"end":2724.393573}]},{"id":268,"readerNo":269,"displayNo":269,"n":269,"cueNo":269,"uniqueCueNo":269,"finalCueNo":269,"originalDisplayNo":269,"type":"dialogue","vi":"Kết quả là…\nVâng, ngày mai tôi có thể đến phỏng vấn.\nSÁNG MAI 10:00 CÔ ĐẾN PHỎNG VẤN NHÉ?","ko":"[직원2] 네, 내일 면접 가능합니다","en":"As a result…\nYes, I'm available tomorrow for the interview.\nHR MANAGER: CAN WE INTERVIEW YOU TOMORROW AT 10?","text":"Kết quả là…\nVâng, ngày mai tôi có thể đến phỏng vấn.\nSÁNG MAI 10:00 CÔ ĐẾN PHỎNG VẤN NHÉ?\\n[직원2] 네, 내일 면접 가능합니다\\nAs a result…\nYes, I'm available tomorrow for the interview.\nHR MANAGER: CAN WE INTERVIEW YOU TOMORROW AT 10?","sourceUid":"merged-mraldrgc-70","uid":"merged-mraldrgc-70","sourceNo":598,"originalSourceNo":598,"manualOrder":269,"workspaceFixedOrder":269,"lockedOrder":269,"orderLocked":true,"start":2672.267419,"end":2736.222869,"viRange":{"start":2672.267419,"end":2683.13912},"koRange":{"start":2724.393573,"end":2736.222869},"viRanges":[{"start":2672.267419,"end":2683.13912}],"koRanges":[{"start":2724.393573,"end":2736.222869}]},{"id":269,"readerNo":270,"displayNo":270,"n":270,"cueNo":270,"uniqueCueNo":270,"finalCueNo":270,"originalDisplayNo":270,"type":"narration","vi":"…cả copywriter và trợ lý nghệ thuật do công ty tốn tiền bạc và sức lực đào tạo\nđều đã nghỉ việc.","ko":"돈 쓰고 시간 써서 힘들게 가르친 대리급 카피랑 아트\n다 퇴사하는 거 아닙니까?","en":"…the copywriter and art director we trained with our own money and efforts\nboth left the company.","text":"…cả copywriter và trợ lý nghệ thuật do công ty tốn tiền bạc và sức lực đào tạo\nđều đã nghỉ việc.\\n돈 쓰고 시간 써서 힘들게 가르친 대리급 카피랑 아트\n다 퇴사하는 거 아닙니까?\\n…the copywriter and art director we trained with our own money and efforts\nboth left the company.","sourceUid":"merged-mralf2xw-71","uid":"merged-mralf2xw-71","sourceNo":689,"originalSourceNo":689,"manualOrder":270,"workspaceFixedOrder":270,"lockedOrder":270,"orderLocked":true,"start":2683.13912,"end":2743.743252,"viRange":{"start":2683.13912,"end":2690.578213},"koRange":{"start":2736.222869,"end":2743.743252},"viRanges":[{"start":2683.13912,"end":2690.578213}],"koRanges":[{"start":2736.222869,"end":2743.743252}]},{"id":270,"readerNo":271,"displayNo":271,"n":271,"cueNo":271,"uniqueCueNo":271,"finalCueNo":271,"originalDisplayNo":271,"type":"narration","vi":"Nào. Tiếp theo. Đội phó Eun Su Yeon.\nTôi sẽ để mắt đến cô ấy. Anh khỏi cần bận tâm.","ko":"[아인] 자, 다음은. 은수연 부장\n[창수] 그 부분은 내가 신경 써 볼게\n신경 쓰지 마세요","en":"All right. Next.\nManager Eun Su-yeon. I'll take care of her.\nYou don't need to.","text":"Nào. Tiếp theo. Đội phó Eun Su Yeon.\nTôi sẽ để mắt đến cô ấy. Anh khỏi cần bận tâm.\\n[아인] 자, 다음은. 은수연 부장\n[창수] 그 부분은 내가 신경 써 볼게\n신경 쓰지 마세요\\nAll right. Next.\nManager Eun Su-yeon. I'll take care of her.\nYou don't need to.","sourceUid":"merged-mralglzh-72","uid":"merged-mralglzh-72","sourceNo":603,"originalSourceNo":603,"manualOrder":271,"workspaceFixedOrder":271,"lockedOrder":271,"orderLocked":true,"start":2690.578213,"end":2759.291914,"viRange":{"start":2690.578213,"end":2704.777215},"koRange":{"start":2743.743252,"end":2759.291914},"viRanges":[{"start":2690.578213,"end":2704.777215}],"koRanges":[{"start":2743.743252,"end":2759.291914}]},{"id":271,"readerNo":272,"displayNo":272,"n":272,"cueNo":272,"uniqueCueNo":272,"finalCueNo":272,"originalDisplayNo":272,"type":"narration","vi":"Tôi, giám đốc sáng tạo mới được bổ nhiệm, sẽ để mắt đến cô ta.","ko":"신임 제작 본부장인 제가 신경 쓰고 있으니까","en":"I'm on her case as the newly-appointed chief creative officer.","text":"Tôi, giám đốc sáng tạo mới được bổ nhiệm, sẽ để mắt đến cô ta.\\n신임 제작 본부장인 제가 신경 쓰고 있으니까\\nI'm on her case as the newly-appointed chief creative officer.","sourceUid":"merged-mralhs2t-73","uid":"merged-mralhs2t-73","sourceNo":694,"originalSourceNo":694,"manualOrder":272,"workspaceFixedOrder":272,"lockedOrder":272,"orderLocked":true,"start":2704.777215,"end":2763.213184,"viRange":{"start":2704.777215,"end":2710.027827},"koRange":{"start":2759.291914,"end":2763.213184},"viRanges":[{"start":2704.777215,"end":2710.027827}],"koRanges":[{"start":2759.291914,"end":2763.213184}]},{"id":272,"readerNo":273,"displayNo":273,"n":273,"cueNo":273,"uniqueCueNo":273,"finalCueNo":273,"originalDisplayNo":273,"type":"narration","vi":"Coi anh ta kìa, ra vẻ quá rồi bị trời phạt đấy.\nVì cô ấy cố tình chia bè kết phái,\n[âm nhạc đen tối]\nnên mới đây một đội phó đã chuyển sang công ty đối thủ.\nAnh còn nhớ chứ?\nĐâu thể nói đó là lỗi của cô ấy.","ko":"[은 부장] 그러게 왜 유난을 떨어서 저 꼴을 당해 \n[아인] 은 부장 사내 정치질 때문에\n[어두운 음악]\n최근에 부장 하나 경쟁사로 이직했죠?\n기억나세요?\n그건 뭐, 꼭 은 부장 때문이라기는…\n올해 들어","en":"Look at him go after all the fuss. Because of her workplace politics,\n[dark music]\na manager recently moved to a competing agency.\nDo you remember?\nIt's hard to say that's her fault.","text":"Coi anh ta kìa, ra vẻ quá rồi bị trời phạt đấy.\nVì cô ấy cố tình chia bè kết phái,\n[âm nhạc đen tối]\nnên mới đây một đội phó đã chuyển sang công ty đối thủ.\nAnh còn nhớ chứ?\nĐâu thể nói đó là lỗi của cô ấy.\\n[은 부장] 그러게 왜 유난을 떨어서 저 꼴을 당해 \n[아인] 은 부장 사내 정치질 때문에\n[어두운 음악]\n최근에 부장 하나 경쟁사로 이직했죠?\n기억나세요?\n그건 뭐, 꼭 은 부장 때문이라기는…\n올해 들어\\nLook at him go after all the fuss. Because of her workplace politics,\n[dark music]\na manager recently moved to a competing agency.\nDo you remember?\nIt's hard to say that's her fault.","sourceUid":"merged-mran0gzo-76","uid":"merged-mran0gzo-76","sourceNo":701,"originalSourceNo":701,"manualOrder":273,"workspaceFixedOrder":273,"lockedOrder":273,"orderLocked":true,"start":2710.027827,"end":2786.859092,"viRange":{"start":2710.027827,"end":2732.573858},"koRange":{"start":2763.213184,"end":2786.859092},"viRanges":[{"start":2710.027827,"end":2732.573858}],"koRanges":[{"start":2763.213184,"end":2786.859092}]},{"id":273,"readerNo":274,"displayNo":274,"n":274,"cueNo":274,"uniqueCueNo":274,"finalCueNo":274,"originalDisplayNo":274,"type":"narration","vi":"Trong năm qua, số dự án đấu thầu mà công ty bị mất vào tay đội phó đã nghỉ việc đó có giá trị gần 35 tỷ won.\nVì kiểu làm việc bè phái của Đội phó Eun mà các vị quý mến, công ty đã vụt mất 35 tỷ won.","ko":"그 이직한 직원네 팀이랑 붙어서 뺏긴 경쟁 PT 빌링만\n약 350억\n여러분들이 이뻐하는 은 부장 사내 정치질로 날린 돈이 350억","en":"The presentation billings that we lost this year to the team the manager transferred to\nis a whopping 35 billion.\nBecause of your beloved Manager Eun's workplace politics, we lost 35 billion won.","text":"Trong năm qua, số dự án đấu thầu mà công ty bị mất vào tay đội phó đã nghỉ việc đó có giá trị gần 35 tỷ won.\nVì kiểu làm việc bè phái của Đội phó Eun mà các vị quý mến, công ty đã vụt mất 35 tỷ won.\\n그 이직한 직원네 팀이랑 붙어서 뺏긴 경쟁 PT 빌링만\n약 350억\n여러분들이 이뻐하는 은 부장 사내 정치질로 날린 돈이 350억\\nThe presentation billings that we lost this year to the team the manager transferred to\nis a whopping 35 billion.\nBecause of your beloved Manager Eun's workplace politics, we lost 35 billion won.","sourceUid":"merged-mran3ine-78","uid":"merged-mran3ine-78","sourceNo":704,"originalSourceNo":704,"manualOrder":274,"workspaceFixedOrder":274,"lockedOrder":274,"orderLocked":true,"start":2732.573858,"end":2803.171129,"viRange":{"start":2732.573858,"end":2749.8},"koRange":{"start":2786.859092,"end":2803.171129},"viRanges":[{"start":2732.573858,"end":2749.8}],"koRanges":[{"start":2786.859092,"end":2803.171129}]},{"id":274,"readerNo":275,"displayNo":275,"n":275,"cueNo":275,"uniqueCueNo":275,"finalCueNo":275,"originalDisplayNo":275,"type":"narration","vi":"Cô không phóng đại đấy chứ? Phóng đại sao?\nTrừ các công ty trực thuộc, ta đang mất dần khách hàng.","ko":"거, 너무 과장하시는 거 아닙니까? 과장이라고요?\n계열사 물량 제하면 광고주 점점 줄어들고 있는 거 모르세요?","en":"Aren't you exaggerating? Am I?\nApart from our affiliated companies, we're losing clients by the day.","text":"Cô không phóng đại đấy chứ? Phóng đại sao?\nTrừ các công ty trực thuộc, ta đang mất dần khách hàng.\\n거, 너무 과장하시는 거 아닙니까? 과장이라고요?\n계열사 물량 제하면 광고주 점점 줄어들고 있는 거 모르세요?\\nAren't you exaggerating? Am I?\nApart from our affiliated companies, we're losing clients by the day.","sourceUid":"merged-mran5mqi-79","uid":"merged-mran5mqi-79","sourceNo":708,"originalSourceNo":708,"manualOrder":275,"workspaceFixedOrder":275,"lockedOrder":275,"orderLocked":true,"start":2749.8,"end":2811.899036,"viRange":{"start":2749.8,"end":2758.342203},"koRange":{"start":2803.171129,"end":2811.899036},"viRanges":[{"start":2749.8,"end":2758.342203}],"koRanges":[{"start":2803.171129,"end":2811.899036}]},{"id":275,"readerNo":276,"displayNo":276,"n":276,"cueNo":276,"uniqueCueNo":276,"finalCueNo":276,"originalDisplayNo":276,"type":"narration","vi":"Đó là vì tình hình chung của thị trường…\nTruyền thông VC đang trên đà sụp đổ.\nChỉ có tôi nhìn ra thôi sao?\nTôi giải thích nữa nhé?","ko":"[임원2] 그거야 기업들 상황이 안 좋으니까\n여기서 VC기획 개판 된 거\n저만 알고 있는 사실입니까?\n더 설명해 드릴까요?","en":"That's because they are in a bad financial--\nWe are going down the drain.\nAm I the only one who knows that?\nShould I enlighten you?","text":"Đó là vì tình hình chung của thị trường…\nTruyền thông VC đang trên đà sụp đổ.\nChỉ có tôi nhìn ra thôi sao?\nTôi giải thích nữa nhé?\\n[임원2] 그거야 기업들 상황이 안 좋으니까\n여기서 VC기획 개판 된 거\n저만 알고 있는 사실입니까?\n더 설명해 드릴까요?\\nThat's because they are in a bad financial--\nWe are going down the drain.\nAm I the only one who knows that?\nShould I enlighten you?","sourceUid":"merged-mran6s4p-80","uid":"merged-mran6s4p-80","sourceNo":714,"originalSourceNo":714,"manualOrder":276,"workspaceFixedOrder":276,"lockedOrder":276,"orderLocked":true,"start":2758.342203,"end":2820.497854,"viRange":{"start":2758.342203,"end":2767.792725},"koRange":{"start":2811.899036,"end":2820.497854},"viRanges":[{"start":2758.342203,"end":2767.792725}],"koRanges":[{"start":2811.899036,"end":2820.497854}]},{"id":276,"readerNo":277,"displayNo":277,"n":277,"cueNo":277,"uniqueCueNo":277,"finalCueNo":277,"originalDisplayNo":277,"type":"narration","vi":"Dù vậy đi nữa, cũng không thể luân chuyển… Tôi sẽ từ chức.\nNếu tôi không thể làm tăng 50 phần trăm doanh số trong vòng 6 tháng,\ntôi sẽ chịu trách nhiệm và nghỉ việc.","ko":"거, 뭐, 아무리 그래도 지금 인사는 사표 쓰겠습니다\n6개월 내로 매출 50% 상승 걸고 결과 못 내면\n책임지고 회사 나가겠습니다","en":"But still, a transfer like this-- I'll resign.\nIf I don't get our sales up by 50 percent within 6 months,\nI'll take responsibility and resign.","text":"Dù vậy đi nữa, cũng không thể luân chuyển… Tôi sẽ từ chức.\nNếu tôi không thể làm tăng 50 phần trăm doanh số trong vòng 6 tháng,\ntôi sẽ chịu trách nhiệm và nghỉ việc.\\n거, 뭐, 아무리 그래도 지금 인사는 사표 쓰겠습니다\n6개월 내로 매출 50% 상승 걸고 결과 못 내면\n책임지고 회사 나가겠습니다\\nBut still, a transfer like this-- I'll resign.\nIf I don't get our sales up by 50 percent within 6 months,\nI'll take responsibility and resign.","sourceUid":"merged-mrancclh-81","uid":"merged-mrancclh-81","sourceNo":717,"originalSourceNo":717,"manualOrder":277,"workspaceFixedOrder":277,"lockedOrder":277,"orderLocked":true,"start":2775,"end":2845.137143,"viRange":{"start":2775,"end":2793.540752},"koRange":{"start":2827,"end":2845.137143},"viRanges":[{"start":2775,"end":2793.540752}],"koRanges":[{"start":2827,"end":2845.137143}]},{"id":277,"readerNo":278,"displayNo":278,"n":278,"cueNo":278,"uniqueCueNo":278,"finalCueNo":278,"originalDisplayNo":278,"type":"narration","vi":"[âm nhạc hồi hộp]","ko":"[긴장되는 음악]","en":"[nervous music]","text":"[âm nhạc hồi hộp]\\n[긴장되는 음악]\\n[nervous music]","sourceUid":"ko-mr905eaf-1586","uid":"ko-mr905eaf-1586","sourceNo":715,"originalSourceNo":715,"manualOrder":278,"workspaceFixedOrder":278,"lockedOrder":278,"orderLocked":true,"start":2801.29,"end":2803.42,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":278,"readerNo":279,"displayNo":279,"n":279,"cueNo":279,"uniqueCueNo":279,"finalCueNo":279,"originalDisplayNo":279,"type":"narration","vi":"Chị Cho, chị điên rồi sao? Sao chị lại xin nghỉ việc?\nChị nói gì đi. Sao đột nhiên chị lại nghỉ?","ko":"[장우] 카피님 아, 미쳤어요? 사표를 왜 써요 \n아, 뭐라고 말씀을 좀 해 보세요 회사를 갑자기 왜 관둬요?","en":"Ms. Cho. Are you nuts? Why would you quit? Come on, answer me. Why quit so suddenly?","text":"Chị Cho, chị điên rồi sao? Sao chị lại xin nghỉ việc?\nChị nói gì đi. Sao đột nhiên chị lại nghỉ?\\n[장우] 카피님 아, 미쳤어요? 사표를 왜 써요 \n아, 뭐라고 말씀을 좀 해 보세요 회사를 갑자기 왜 관둬요?\\nMs. Cho. Are you nuts? Why would you quit? Come on, answer me. Why quit so suddenly?","sourceUid":"merged-mranijir-82","uid":"merged-mranijir-82","sourceNo":720,"originalSourceNo":720,"manualOrder":279,"workspaceFixedOrder":279,"lockedOrder":279,"orderLocked":true,"start":2805,"end":2925.299592,"viRange":{"start":2805,"end":2812.773061},"koRange":{"start":2915.3,"end":2925.299592},"viRanges":[{"start":2805,"end":2812.773061}],"koRanges":[{"start":2915.3,"end":2925.299592}]},{"id":279,"readerNo":280,"displayNo":280,"n":280,"cueNo":280,"uniqueCueNo":280,"finalCueNo":280,"originalDisplayNo":280,"type":"narration","vi":"Chị bị bệnh à? Hay là… Thôi nào, chị nói gì đi. Trời ạ, người ta đang ăn mà cứ bắt nói. Chờ chút.","ko":"어디 아파요? 아님\n아, 뭐라고 말 좀…\n아, 왜 자꾸 먹고 있는데 말을 시켜\n[은정] 잠깐만","en":"Are you sick? Or…\nCome on, say something.\nDon't make me talk when I'm eating.\nWait.","text":"Chị bị bệnh à? Hay là… Thôi nào, chị nói gì đi. Trời ạ, người ta đang ăn mà cứ bắt nói. Chờ chút.\\n어디 아파요? 아님\n아, 뭐라고 말 좀…\n아, 왜 자꾸 먹고 있는데 말을 시켜\n[은정] 잠깐만\\nAre you sick? Or…\nCome on, say something.\nDon't make me talk when I'm eating.\nWait.","sourceUid":"merged-mranqu38-83","uid":"merged-mranqu38-83","sourceNo":724,"originalSourceNo":724,"manualOrder":280,"workspaceFixedOrder":280,"lockedOrder":280,"orderLocked":true,"start":2812.773061,"end":2931.677871,"viRange":{"start":2812.773061,"end":2822.739286},"koRange":{"start":2925.299592,"end":2931.677871},"viRanges":[{"start":2812.773061,"end":2822.739286}],"koRanges":[{"start":2925.299592,"end":2931.677871}]},{"id":280,"readerNo":281,"displayNo":281,"n":281,"cueNo":281,"uniqueCueNo":281,"finalCueNo":281,"originalDisplayNo":281,"type":"narration","vi":"Tôi đã đắn đo về việc này từ lâu rồi.\nTôi nghĩ đã đến lúc rồi.","ko":"아니, 하루 이틀 한 고민도 아니고 이젠 때가 된 거 같아","en":"I've thought about this for a long time.\nI think it's time now.","text":"Tôi đã đắn đo về việc này từ lâu rồi.\nTôi nghĩ đã đến lúc rồi.\\n아니, 하루 이틀 한 고민도 아니고 이젠 때가 된 거 같아\\nI've thought about this for a long time.\nI think it's time now.","sourceUid":"merged-mraoi3nd-84","uid":"merged-mraoi3nd-84","sourceNo":726,"originalSourceNo":726,"manualOrder":281,"workspaceFixedOrder":281,"lockedOrder":281,"orderLocked":true,"start":2822.739286,"end":2939.875905,"viRange":{"start":2822.739286,"end":2827.4},"koRange":{"start":2931.677871,"end":2939.875905},"viRanges":[{"start":2822.739286,"end":2827.4}],"koRanges":[{"start":2931.677871,"end":2939.875905}]},{"id":281,"readerNo":282,"displayNo":282,"n":282,"cueNo":282,"uniqueCueNo":282,"finalCueNo":282,"originalDisplayNo":282,"type":"narration","vi":"Sao vậy? Vì con trai chị sao?\nTôi đâu thể bắt thằng bé sống như thể không có mẹ mãi được.","ko":"왜요, 아들 때문에요?\n엄마 없는 자식으로 언제까지 살게 하겠어","en":"Why? Because of your son?\nI can't let him stay as a motherless child.","text":"Sao vậy? Vì con trai chị sao?\nTôi đâu thể bắt thằng bé sống như thể không có mẹ mãi được.\\n왜요, 아들 때문에요?\n엄마 없는 자식으로 언제까지 살게 하겠어\\nWhy? Because of your son?\nI can't let him stay as a motherless child.","sourceUid":"merged-mraote6p-85","uid":"merged-mraote6p-85","sourceNo":728,"originalSourceNo":728,"manualOrder":282,"workspaceFixedOrder":282,"lockedOrder":282,"orderLocked":true,"start":2827.4,"end":2944.345761,"viRange":{"start":2827.4,"end":2831.98915},"koRange":{"start":2939.875905,"end":2944.345761},"viRanges":[{"start":2827.4,"end":2831.98915}],"koRanges":[{"start":2939.875905,"end":2944.345761}]},{"id":282,"readerNo":283,"displayNo":283,"n":283,"cueNo":283,"uniqueCueNo":283,"finalCueNo":283,"originalDisplayNo":283,"type":"narration","vi":"Nhưng có mẹ thành công thì cũng tốt mà.\nTrẻ con thường thích một người mẹ luôn ở cạnh chúng.","ko":"아, 그래도 성공한 엄마 있으면 좋지\n애들한텐 하루 종일 옆에 있어 주는 엄마가 최고니까","en":"But it's great to have a successful mom.\nFor kids, a mom who stays with them is the best.","text":"Nhưng có mẹ thành công thì cũng tốt mà.\nTrẻ con thường thích một người mẹ luôn ở cạnh chúng.\\n아, 그래도 성공한 엄마 있으면 좋지\n애들한텐 하루 종일 옆에 있어 주는 엄마가 최고니까\\nBut it's great to have a successful mom.\nFor kids, a mom who stays with them is the best.","sourceUid":"merged-mraou184-86","uid":"merged-mraou184-86","sourceNo":730,"originalSourceNo":730,"manualOrder":283,"workspaceFixedOrder":283,"lockedOrder":283,"orderLocked":true,"start":2831.98915,"end":2949.436736,"viRange":{"start":2831.98915,"end":2837.066801},"koRange":{"start":2944.345761,"end":2949.436736},"viRanges":[{"start":2831.98915,"end":2837.066801}],"koRanges":[{"start":2944.345761,"end":2949.436736}]},{"id":283,"readerNo":284,"displayNo":284,"n":284,"cueNo":284,"uniqueCueNo":284,"finalCueNo":284,"originalDisplayNo":284,"type":"narration","vi":"Ôi, tôi nhạt miệng quá.\nChị nhìn mà xem.\nMới nói sẽ xin nghỉ mà chị đã nhạt miệng rồi.","ko":"아유, 입맛도 없다\n[장우] 이거 봐요, 이거 봐, 어?\n사표 쓴다고 하니까 벌써부터 입맛 없어서","en":"I don't have the appetite.\nLook at this.\nYou lost your appetite because you're quitting.","text":"Ôi, tôi nhạt miệng quá.\nChị nhìn mà xem.\nMới nói sẽ xin nghỉ mà chị đã nhạt miệng rồi.\\n아유, 입맛도 없다\n[장우] 이거 봐요, 이거 봐, 어?\n사표 쓴다고 하니까 벌써부터 입맛 없어서\\nI don't have the appetite.\nLook at this.\nYou lost your appetite because you're quitting.","sourceUid":"merged-mraousvk-87","uid":"merged-mraousvk-87","sourceNo":734,"originalSourceNo":734,"manualOrder":284,"workspaceFixedOrder":284,"lockedOrder":284,"orderLocked":true,"start":2837.066801,"end":2958.904673,"viRange":{"start":2837.066801,"end":2846.569215},"koRange":{"start":2949.436736,"end":2958.904673},"viRanges":[{"start":2837.066801,"end":2846.569215}],"koRanges":[{"start":2949.436736,"end":2958.904673}]},{"id":284,"readerNo":285,"displayNo":285,"n":285,"cueNo":285,"uniqueCueNo":285,"finalCueNo":285,"originalDisplayNo":285,"type":"narration","vi":"Chị chỉ ăn được mỗi hai bát cơm.\nDạo này tôi cứ như vậy hoài. Chẳng lúc nào thấy ngon miệng.","ko":"밥도 두 공기밖에 못 드시잖아\n야, 내가 요즘 그래\n영 입안이 깔깔한 게","en":"You only had two bowls of rice.\nI've been like this lately. I don't really have the appetite.","text":"Chị chỉ ăn được mỗi hai bát cơm.\nDạo này tôi cứ như vậy hoài. Chẳng lúc nào thấy ngon miệng.\\n밥도 두 공기밖에 못 드시잖아\n야, 내가 요즘 그래\n영 입안이 깔깔한 게\\nYou only had two bowls of rice.\nI've been like this lately. I don't really have the appetite.","sourceUid":"merged-mraovy7v-88","uid":"merged-mraovy7v-88","sourceNo":737,"originalSourceNo":737,"manualOrder":285,"workspaceFixedOrder":285,"lockedOrder":285,"orderLocked":true,"start":2846.569215,"end":2963.801618,"viRange":{"start":2846.569215,"end":2851.488557},"koRange":{"start":2958.904673,"end":2963.801618},"viRanges":[{"start":2846.569215,"end":2851.488557}],"koRanges":[{"start":2958.904673,"end":2963.801618}]},{"id":285,"readerNo":286,"displayNo":286,"n":286,"cueNo":286,"uniqueCueNo":286,"finalCueNo":286,"originalDisplayNo":286,"type":"narration","vi":"- [Âm nhạc thú vị] - [Jangwoo thở dài]","ko":"- [흥미로운 음악] - [장우의 한숨]","en":"- [Interesting music] - [Jangwoo's sigh]","text":"- [Âm nhạc thú vị] - [Jangwoo thở dài]\\n- [흥미로운 음악] - [장우의 한숨]\\n- [Interesting music] - [Jangwoo's sigh]","sourceUid":"ko-mr905eaf-1603","uid":"ko-mr905eaf-1603","sourceNo":732,"originalSourceNo":732,"manualOrder":286,"workspaceFixedOrder":286,"lockedOrder":286,"orderLocked":true,"start":2863.61,"end":2864.9,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":286,"readerNo":287,"displayNo":287,"n":287,"cueNo":287,"uniqueCueNo":287,"finalCueNo":287,"originalDisplayNo":287,"type":"narration","vi":"Ta đi thôi. Chị phải ăn đồ ngọt vào thì mới suy nghĩ tích cực được.\nĐi nào.","ko":"나가요, 단걸 먹어야 생각을 긍정적으로 하지\n[장우] 자","en":"Let's go. You need something sweet to think positively.\nCome on.","text":"Ta đi thôi. Chị phải ăn đồ ngọt vào thì mới suy nghĩ tích cực được.\nĐi nào.\\n나가요, 단걸 먹어야 생각을 긍정적으로 하지\n[장우] 자\\nLet's go. You need something sweet to think positively.\nCome on.","sourceUid":"merged-mraoxfcx-89","uid":"merged-mraoxfcx-89","sourceNo":739,"originalSourceNo":739,"manualOrder":287,"workspaceFixedOrder":287,"lockedOrder":287,"orderLocked":true,"start":2851.488557,"end":2967.65905,"viRange":{"start":2851.488557,"end":2855.897626},"koRange":{"start":2963.801618,"end":2967.65905},"viRanges":[{"start":2851.488557,"end":2855.897626}],"koRanges":[{"start":2963.801618,"end":2967.65905}]},{"id":287,"readerNo":288,"displayNo":288,"n":288,"cueNo":288,"uniqueCueNo":288,"finalCueNo":288,"originalDisplayNo":288,"type":"narration","vi":"Giám đốc Go, chúng ta suy nghĩ tích cực hơn đi.","ko":"[기호] 상무님, 우리 일 좀 긍정적으로 합시다, 긍정적으로","en":"Ms. Go, why don't we think more positively?","text":"Giám đốc Go, chúng ta suy nghĩ tích cực hơn đi.\\n[기호] 상무님, 우리 일 좀 긍정적으로 합시다, 긍정적으로\\nMs. Go, why don't we think more positively?","sourceUid":"merged-mrap507m-90","uid":"merged-mrap507m-90","sourceNo":741,"originalSourceNo":741,"manualOrder":288,"workspaceFixedOrder":288,"lockedOrder":288,"orderLocked":true,"start":2855.897626,"end":2977.800365,"viRange":{"start":2855.897626,"end":2865.252375},"koRange":{"start":2972.880456,"end":2977.800365},"viRanges":[{"start":2855.897626,"end":2865.252375}],"koRanges":[{"start":2972.880456,"end":2977.800365}]},{"id":288,"readerNo":289,"displayNo":289,"n":289,"cueNo":289,"uniqueCueNo":289,"finalCueNo":289,"originalDisplayNo":289,"type":"narration","vi":"[Âm thanh sức mạnh của Jangwoo]","ko":"[장우의 힘주는 소리]","en":"[Jangwoo’s sound of strength]","text":"[Âm thanh sức mạnh của Jangwoo]\\n[장우의 힘주는 소리]\\n[Jangwoo’s sound of strength]","sourceUid":"ko-mr905eaf-1611","uid":"ko-mr905eaf-1611","sourceNo":740,"originalSourceNo":740,"manualOrder":289,"workspaceFixedOrder":289,"lockedOrder":289,"orderLocked":true,"start":2879.87,"end":2881.21,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":289,"readerNo":290,"displayNo":290,"n":290,"cueNo":290,"uniqueCueNo":290,"finalCueNo":290,"originalDisplayNo":290,"type":"narration","vi":"Tôi nghĩ tất cả các vị ngồi đây đều nhầm lẫn rồi.\nTôi không có bố mẹ, tốt nghiệp trường tỉnh, và có gia cảnh nghèo khó.","ko":"대표님 예하 임원분들께서 착각하시나 본데요\n저는 부모도 없고 지방대 출신\n[아인] 흙수저 여자입니다","en":"I think all the executives have the wrong idea here.\nI am an orphan from a lousy university and a woman from a poor family.","text":"Tôi nghĩ tất cả các vị ngồi đây đều nhầm lẫn rồi.\nTôi không có bố mẹ, tốt nghiệp trường tỉnh, và có gia cảnh nghèo khó.\\n대표님 예하 임원분들께서 착각하시나 본데요\n저는 부모도 없고 지방대 출신\n[아인] 흙수저 여자입니다\\nI think all the executives have the wrong idea here.\nI am an orphan from a lousy university and a woman from a poor family.","sourceUid":"merged-mrap7j6p-92","uid":"merged-mrap7j6p-92","sourceNo":744,"originalSourceNo":744,"manualOrder":290,"workspaceFixedOrder":290,"lockedOrder":290,"orderLocked":true,"start":2865.252375,"end":2991.826617,"viRange":{"start":2865.252375,"end":2879.33199},"koRange":{"start":2981.214878,"end":2991.826617},"viRanges":[{"start":2865.252375,"end":2879.33199}],"koRanges":[{"start":2981.214878,"end":2991.826617}]},{"id":290,"readerNo":291,"displayNo":291,"n":291,"cueNo":291,"uniqueCueNo":291,"finalCueNo":291,"originalDisplayNo":291,"type":"narration","vi":"Nên các vị mới thăng chức cho tôi làm giám đốc bù nhìn.\nKhông phải sao?","ko":"그래서 저를 얼굴마담 임원으로 앉히신 거잖아요\n아닌가요?","en":"That's why you made me a figurehead executive.\nAm I wrong?","text":"Nên các vị mới thăng chức cho tôi làm giám đốc bù nhìn.\nKhông phải sao?\\n그래서 저를 얼굴마담 임원으로 앉히신 거잖아요\n아닌가요?\\nThat's why you made me a figurehead executive.\nAm I wrong?","sourceUid":"merged-mrap8ktl-93","uid":"merged-mrap8ktl-93","sourceNo":746,"originalSourceNo":746,"manualOrder":291,"workspaceFixedOrder":291,"lockedOrder":291,"orderLocked":true,"start":2879.33199,"end":2999.215983,"viRange":{"start":2879.33199,"end":2886.229593},"koRange":{"start":2991.826617,"end":2999.215983},"viRanges":[{"start":2879.33199,"end":2886.229593}],"koRanges":[{"start":2991.826617,"end":2999.215983}]},{"id":291,"readerNo":292,"displayNo":292,"n":292,"cueNo":292,"uniqueCueNo":292,"finalCueNo":292,"originalDisplayNo":292,"type":"narration","vi":"Suy nghĩ tích cực?\nĐó là phong thái của những người sở hữu nhiều thứ trong tay. Giống như các vị.","ko":"긍정적으로요?\n그건 많이 가진 사람들의 자세죠 여러분들처럼","en":"Think positively?\nThat's the attitude of those who have a lot. Like all of you.","text":"Suy nghĩ tích cực?\nĐó là phong thái của những người sở hữu nhiều thứ trong tay. Giống như các vị.\\n긍정적으로요?\n그건 많이 가진 사람들의 자세죠 여러분들처럼\\nThink positively?\nThat's the attitude of those who have a lot. Like all of you.","sourceUid":"merged-mrap9jyq-94","uid":"merged-mrap9jyq-94","sourceNo":750,"originalSourceNo":750,"manualOrder":292,"workspaceFixedOrder":292,"lockedOrder":292,"orderLocked":true,"start":2892,"end":3011.336813,"viRange":{"start":2892,"end":2899.200501},"koRange":{"start":2999.215983,"end":3011.336813},"viRanges":[{"start":2892,"end":2899.200501}],"koRanges":[{"start":2999.215983,"end":3011.336813}]},{"id":292,"readerNo":293,"displayNo":293,"n":293,"cueNo":293,"uniqueCueNo":293,"finalCueNo":293,"originalDisplayNo":293,"type":"narration","vi":"[âm nhạc đen tối]","ko":"[어두운 음악]","en":"[dark music]","text":"[âm nhạc đen tối]\\n[어두운 음악]\\n[dark music]","sourceUid":"ko-mr905eaf-1618","uid":"ko-mr905eaf-1618","sourceNo":747,"originalSourceNo":747,"manualOrder":293,"workspaceFixedOrder":293,"lockedOrder":293,"orderLocked":true,"start":2908.94,"end":2910.9,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":293,"readerNo":294,"displayNo":294,"n":294,"cueNo":294,"uniqueCueNo":294,"finalCueNo":294,"originalDisplayNo":294,"type":"narration","vi":"Với những kẻ chẳng có gì để mất như tôi, tôi không suy nghĩ tích cực được.\nSuy nghĩ về tiền thì dễ hơn.","ko":"저처럼 잃을 게 없는 부류들은 긍정적으로 생각하지 않습니다\n금전적으로 생각하지","en":"For those with nothing to lose like me, it's hard to be positive.\nIt's easier to be money-grubbing.","text":"Với những kẻ chẳng có gì để mất như tôi, tôi không suy nghĩ tích cực được.\nSuy nghĩ về tiền thì dễ hơn.\\n저처럼 잃을 게 없는 부류들은 긍정적으로 생각하지 않습니다\n금전적으로 생각하지\\nFor those with nothing to lose like me, it's hard to be positive.\nIt's easier to be money-grubbing.","sourceUid":"merged-mrapbi05-95","uid":"merged-mrapbi05-95","sourceNo":752,"originalSourceNo":752,"manualOrder":294,"workspaceFixedOrder":294,"lockedOrder":294,"orderLocked":true,"start":2899.200501,"end":3018.666064,"viRange":{"start":2899.200501,"end":2907.098629},"koRange":{"start":3011.336813,"end":3018.666064},"viRanges":[{"start":2899.200501,"end":2907.098629}],"koRanges":[{"start":3011.336813,"end":3018.666064}]},{"id":294,"readerNo":295,"displayNo":295,"n":295,"cueNo":295,"uniqueCueNo":295,"finalCueNo":295,"originalDisplayNo":295,"type":"narration","vi":"Tôi sẽ chứng minh bằng kết quả và những con số.\nDù vậy, nếu các vị vẫn muốn ngăn cản tôi, thì ít nhất các vị cũng nên đánh cược chức vị của mình giống tôi.\nCác vị có mất gì đâu.","ko":"결과로 오직 숫자로 보여 드리겠습니다\n그래도 저를 막고 싶으시다면 어떠세요?\n저처럼 여러분들 자리를 거시든가\n손해 보는 장사 아닐 텐데","en":"I will prove myself with results and numbers.\nDespite all that, if you still want to hold me back, then you should at least put your position on the line like me.\nYou don't have anything to lose.","text":"Tôi sẽ chứng minh bằng kết quả và những con số.\nDù vậy, nếu các vị vẫn muốn ngăn cản tôi, thì ít nhất các vị cũng nên đánh cược chức vị của mình giống tôi.\nCác vị có mất gì đâu.\\n결과로 오직 숫자로 보여 드리겠습니다\n그래도 저를 막고 싶으시다면 어떠세요?\n저처럼 여러분들 자리를 거시든가\n손해 보는 장사 아닐 텐데\\nI will prove myself with results and numbers.\nDespite all that, if you still want to hold me back, then you should at least put your position on the line like me.\nYou don't have anything to lose.","sourceUid":"merged-mrape7b6-97","uid":"merged-mrape7b6-97","sourceNo":756,"originalSourceNo":756,"manualOrder":295,"workspaceFixedOrder":295,"lockedOrder":295,"orderLocked":true,"start":2907.098629,"end":3037.344049,"viRange":{"start":2907.098629,"end":2926.230535},"koRange":{"start":3018.666064,"end":3037.344049},"viRanges":[{"start":2907.098629,"end":2926.230535}],"koRanges":[{"start":3018.666064,"end":3037.344049}]},{"id":295,"readerNo":296,"displayNo":296,"n":296,"cueNo":296,"uniqueCueNo":296,"finalCueNo":296,"originalDisplayNo":296,"type":"narration","vi":"Nhưng nếu tôi thành công, ai trong số các vị muốn rời công ty đây?\nGiám đốc Choi có dám đánh cược chức vị của mình không?","ko":"대신 제가 성공하면 누가 회사 나가실래요? \n우리 최 상무님께서 자리를 거시겠어요? 어떠세요, 최 상무님?","en":"But if I succeed, who will leave the company?\nDo you want to put your position on the line, Mr. Choi?","text":"Nhưng nếu tôi thành công, ai trong số các vị muốn rời công ty đây?\nGiám đốc Choi có dám đánh cược chức vị của mình không?\\n대신 제가 성공하면 누가 회사 나가실래요? \n우리 최 상무님께서 자리를 거시겠어요? 어떠세요, 최 상무님?\\nBut if I succeed, who will leave the company?\nDo you want to put your position on the line, Mr. Choi?","sourceUid":"merged-mraplhm8-98","uid":"merged-mraplhm8-98","sourceNo":763,"originalSourceNo":763,"manualOrder":296,"workspaceFixedOrder":296,"lockedOrder":296,"orderLocked":true,"start":2926.230535,"end":3067.996858,"viRange":{"start":2926.230535,"end":2956.00858},"koRange":{"start":3042.712122,"end":3067.996858},"viRanges":[{"start":2926.230535,"end":2956.00858}],"koRanges":[{"start":3042.712122,"end":3067.996858}]},{"id":296,"readerNo":297,"displayNo":297,"n":297,"cueNo":297,"uniqueCueNo":297,"finalCueNo":297,"originalDisplayNo":297,"type":"narration","vi":"[Hiệu ứng âm thanh tối]","ko":"[어두운 효과음]","en":"[Dark sound effect]","text":"[Hiệu ứng âm thanh tối]\\n[어두운 효과음]\\n[Dark sound effect]","sourceUid":"ko-mr905eaf-1631","uid":"ko-mr905eaf-1631","sourceNo":760,"originalSourceNo":760,"manualOrder":297,"workspaceFixedOrder":297,"lockedOrder":297,"orderLocked":true,"start":2965.96,"end":2967.13,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":297,"readerNo":298,"displayNo":298,"n":298,"cueNo":298,"uniqueCueNo":298,"finalCueNo":298,"originalDisplayNo":298,"type":"narration","vi":"Anh thấy thế nào?\nSao anh không đánh cược\nrằng tôi sẽ thất bại?\nKhông có ai à?","ko":"제가 실패한다에\n자리를 한번 걸어 보시죠\n없으신가요?","en":"What do you say? Why don't you bet against me that I'll fail? No one?","text":"Anh thấy thế nào?\nSao anh không đánh cược\nrằng tôi sẽ thất bại?\nKhông có ai à?\\n제가 실패한다에\n자리를 한번 걸어 보시죠\n없으신가요?\\nWhat do you say? Why don't you bet against me that I'll fail? No one?","sourceUid":"merged-mrapoygo-100","uid":"merged-mrapoygo-100","sourceNo":671,"originalSourceNo":671,"manualOrder":298,"workspaceFixedOrder":298,"lockedOrder":298,"orderLocked":true,"start":2956.00858,"end":3093.615423,"viRange":{"start":2956.00858,"end":2981.901732},"koRange":{"start":3067.996858,"end":3093.615423},"viRanges":[{"start":2956.00858,"end":2981.901732}],"koRanges":[{"start":3067.996858,"end":3093.615423}]},{"id":298,"readerNo":299,"displayNo":299,"n":299,"cueNo":299,"uniqueCueNo":299,"finalCueNo":299,"originalDisplayNo":299,"type":"narration","vi":"[cười]","ko":"[헛웃음]","en":"[laughter]","text":"[cười]\\n[헛웃음]\\n[laughter]","sourceUid":"ko-mr905eaf-1637","uid":"ko-mr905eaf-1637","sourceNo":766,"originalSourceNo":766,"manualOrder":299,"workspaceFixedOrder":299,"lockedOrder":299,"orderLocked":true,"start":2996.2,"end":2997.45,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":299,"readerNo":300,"displayNo":300,"n":300,"cueNo":300,"uniqueCueNo":300,"finalCueNo":300,"originalDisplayNo":300,"type":"narration","vi":"Vậy tôi xin phép nói trước luôn.\nTừ nay nếu các vị muốn ngăn cản tôi, hãy lấy chức vị ra cược.","ko":"그럼 미리 말씀드리겠습니다\n앞으로 저를 막고 싶으시다면 여러분의 자리를 거세요","en":"Then let me make it clear.\nIf you want to stop me from now on, put your position on the line.","text":"Vậy tôi xin phép nói trước luôn.\nTừ nay nếu các vị muốn ngăn cản tôi, hãy lấy chức vị ra cược.\\n그럼 미리 말씀드리겠습니다\n앞으로 저를 막고 싶으시다면 여러분의 자리를 거세요\\nThen let me make it clear.\nIf you want to stop me from now on, put your position on the line.","sourceUid":"merged-mrapr03s-101","uid":"merged-mrapr03s-101","sourceNo":770,"originalSourceNo":770,"manualOrder":300,"workspaceFixedOrder":300,"lockedOrder":300,"orderLocked":true,"start":2981.901732,"end":3102.684409,"viRange":{"start":2981.901732,"end":2991.134566},"koRange":{"start":3093.615423,"end":3102.684409},"viRanges":[{"start":2981.901732,"end":2991.134566}],"koRanges":[{"start":3093.615423,"end":3102.684409}]},{"id":300,"readerNo":301,"displayNo":301,"n":301,"cueNo":301,"uniqueCueNo":301,"finalCueNo":301,"originalDisplayNo":301,"type":"narration","vi":"Tôi… tán thành. Nghe rất minh bạch mà.\nGiám đốc sáng tạo mới đã hứa rõ ràng rằng sẽ tăng doanh số\nvới con số và kì hạn cụ thể.\nCô ấy cũng đã hứa sẽ xin nghỉ việc nếu thất bại.","ko":"[재무 상무] 저는 찬성이요. 명쾌하지 않습니까?\n새로 선출된 제작 본부장이\n명확한 매출 상승률과 기간을 숫자로 명시했고\n실패 시 사표 쓰겠다고 약속도 했고","en":"I… approve. This is very clear.\nThe new chief creative officer presented us with a bump in sales and its time frame.\nAnd she promises to resign if she fails.","text":"Tôi… tán thành. Nghe rất minh bạch mà.\nGiám đốc sáng tạo mới đã hứa rõ ràng rằng sẽ tăng doanh số\nvới con số và kì hạn cụ thể.\nCô ấy cũng đã hứa sẽ xin nghỉ việc nếu thất bại.\\n[재무 상무] 저는 찬성이요. 명쾌하지 않습니까?\n새로 선출된 제작 본부장이\n명확한 매출 상승률과 기간을 숫자로 명시했고\n실패 시 사표 쓰겠다고 약속도 했고\\nI… approve. This is very clear.\nThe new chief creative officer presented us with a bump in sales and its time frame.\nAnd she promises to resign if she fails.","sourceUid":"merged-mrapwqpv-105","uid":"merged-mrapwqpv-105","sourceNo":775,"originalSourceNo":775,"manualOrder":301,"workspaceFixedOrder":301,"lockedOrder":301,"orderLocked":true,"start":3000,"end":3127.023768,"viRange":{"start":3000,"end":3011.5},"koRange":{"start":3112,"end":3127.023768},"viRanges":[{"start":3000,"end":3011.5}],"koRanges":[{"start":3112,"end":3127.023768}]},{"id":301,"readerNo":302,"displayNo":302,"n":302,"cueNo":302,"uniqueCueNo":302,"finalCueNo":302,"originalDisplayNo":302,"type":"narration","vi":"Chắc do công việc của tôi là phân tích số liệu.\nNên tôi thích những thứ dễ tính toán. Các vị thấy sao?","ko":"제가 숫자만 보는 사람이라서 그런지\n딱 떨어지는 게 좋네요. 어떠세요들?","en":"My job is to analyze numbers.\nI like how this is all mathematical. What do you say?","text":"Chắc do công việc của tôi là phân tích số liệu.\nNên tôi thích những thứ dễ tính toán. Các vị thấy sao?\\n제가 숫자만 보는 사람이라서 그런지\n딱 떨어지는 게 좋네요. 어떠세요들?\\nMy job is to analyze numbers.\nI like how this is all mathematical. What do you say?","sourceUid":"merged-mraq0gvq-106","uid":"merged-mraq0gvq-106","sourceNo":779,"originalSourceNo":779,"manualOrder":302,"workspaceFixedOrder":302,"lockedOrder":302,"orderLocked":true,"start":3011.5,"end":3135.353938,"viRange":{"start":3011.5,"end":3023.069252},"koRange":{"start":3127.023768,"end":3135.353938},"viRanges":[{"start":3011.5,"end":3023.069252}],"koRanges":[{"start":3127.023768,"end":3135.353938}]},{"id":302,"readerNo":303,"displayNo":303,"n":303,"cueNo":303,"uniqueCueNo":303,"finalCueNo":303,"originalDisplayNo":303,"type":"narration","vi":"Giám đốc Go. Vâng.\nCô có thể chịu trách nhiệm cho lời nói của mình không?","ko":"[문호] 고 상무님. 네\n지금 하신 말씀 책임질 수 있습니까?","en":"Ms. Go. Yes, sir.\nDo you take full responsibility for your words?","text":"Giám đốc Go. Vâng.\nCô có thể chịu trách nhiệm cho lời nói của mình không?\\n[문호] 고 상무님. 네\n지금 하신 말씀 책임질 수 있습니까?\\nMs. Go. Yes, sir.\nDo you take full responsibility for your words?","sourceUid":"merged-mraq27ok-107","uid":"merged-mraq27ok-107","sourceNo":782,"originalSourceNo" \nGrandpa, you want me to chew it for you?","text":"Thế thì lại dai quá. Răng bố yếu lắm không nhai được nữa.\nÔng ơi, hay để cháu nhai hộ ông nhé?\\n[근철] 아, 그럼 질겨서 못 먹디 이도 성치 않은데, 응? \n[한나] 할아버지 그럼 내가 씹어서 줄까?\\nThen it'll be too tough to chew. My teeth aren't healthy anymore.\nGrandpa, you want me to chew it for you?","sourceUid":"merged-mraqwecm-126","uid":"merged-mraqwecm-126","sourceNo":821,"originalSourceNo":821,"manualOrder":316,"workspaceFixedOrder":316,"lockedOrder":316,"orderLocked":true,"start":3190.6,"end":3308.618273,"viRange":{"start":3190.6,"end":3197.065052},"koRange":{"start":3303.000272,"end":3308.618273},"viRanges":[{"start":3190.6,"end":3197.065052}],"koRanges":[{"start":3303.000272,"end":3308.618273}]},{"id":316,"readerNo":317,"displayNo":317,"n":317,"cueNo":317,"uniqueCueNo":317,"finalCueNo":317,"originalDisplayNo":317,"type":"narration","vi":"Thay vì vậy, cháu nên bỏ cái thói đay nghiến người khác trên mạng đi.","ko":"씁, 너래 그 전화기로 SNS, 어?\n그걸로 사람들이나 씹지 말라우","en":"Before that, you should stop chewing people out on social media.","text":"Thay vì vậy, cháu nên bỏ cái thói đay nghiến người khác trên mạng đi.\\n씁, 너래 그 전화기로 SNS, 어?\n그걸로 사람들이나 씹지 말라우\\nBefore that, you should stop chewing people out on social media.","sourceUid":"merged-mraqwnqh-127","uid":"merged-mraqwnqh-127","sourceNo":823,"originalSourceNo":823,"manualOrder":317,"workspaceFixedOrder":317,"lockedOrder":317,"orderLocked":true,"start":3197.065052,"end":3313.88884,"viRange":{"start":3197.065052,"end":3201.840975},"koRange":{"start":3308.618273,"end":3313.88884},"viRanges":[{"start":3197.065052,"end":3201.840975}],"koRanges":[{"start":3308.618273,"end":3313.88884}]},{"id":317,"readerNo":318,"displayNo":318,"n":318,"cueNo":318,"uniqueCueNo":318,"finalCueNo":318,"originalDisplayNo":318,"type":"narration","vi":"Ông tha thứ cho em ấy đi. Đó là sức hút của em ấy mà.\nDạo này em hay chơi gì vậy?","ko":"[한수] 용서하세요 한나는 그런 게 매력이니까요 요즘 뭐 하고 놀아?","en":"Please forgive her. It's part of her charm.\nWhat are you up to lately?","text":"Ông tha thứ cho em ấy đi. Đó là sức hút của em ấy mà.\nDạo này em hay chơi gì vậy?\\n[한수] 용서하세요 한나는 그런 게 매력이니까요 요즘 뭐 하고 놀아?\\nPlease forgive her. It's part of her charm.\nWhat are you up to lately?","sourceUid":"merged-mraqxwo1-128","uid":"merged-mraqxwo1-128","sourceNo":826,"originalSourceNo":826,"manualOrder":318,"workspaceFixedOrder":318,"lockedOrder":318,"orderLocked":true,"start":3201.840975,"end":3321.596049,"viRange":{"start":3201.840975,"end":3209.39907},"koRange":{"start":3313.88884,"end":3321.596049},"viRanges":[{"start":3201.840975,"end":3209.39907}],"koRanges":[{"start":3313.88884,"end":3321.596049}]},{"id":318,"readerNo":319,"displayNo":319,"n":319,"cueNo":319,"uniqueCueNo":319,"finalCueNo":319,"originalDisplayNo":319,"type":"narration","vi":"Em đang chơi rất vui với bạn bè.\nEm không trả tiền cho bạn bè để họ chơi cùng em như anh.","ko":"나야 친구들이랑 신나게 놀지\n오빠처럼 돈 받아야 놀아 주는 애들하고는 안 놀아 [웃음]","en":"I hang out with my friends and have fun.\nUnlike you, I don't pay my friends to hang out with me.","text":"Em đang chơi rất vui với bạn bè.\nEm không trả tiền cho bạn bè để họ chơi cùng em như anh.\\n나야 친구들이랑 신나게 놀지\n오빠처럼 돈 받아야 놀아 주는 애들하고는 안 놀아 [웃음]\\nI hang out with my friends and have fun.\nUnlike you, I don't pay my friends to hang out with me.","sourceUid":"merged-mraqz0vb-129","uid":"merged-mraqz0vb-129","sourceNo":828,"originalSourceNo":828,"manualOrder":319,"workspaceFixedOrder":319,"lockedOrder":319,"orderLocked":true,"start":3209.39907,"end":3328.46782,"viRange":{"start":3209.39907,"end":3216.546944},"koRange":{"start":3321.596049,"end":3328.46782},"viRanges":[{"start":3209.39907,"end":3216.546944}],"koRanges":[{"start":3321.596049,"end":3328.46782}]},{"id":319,"readerNo":320,"displayNo":320,"n":320,"cueNo":320,"uniqueCueNo":320,"finalCueNo":320,"originalDisplayNo":320,"type":"narration","vi":"[Seojeong cười] [Hannah]...","ko":"[서정이 풉 웃는다][한나] 씨…","en":"[Seojeong laughs] [Hannah]...","text":"[Seojeong cười] [Hannah]. alking like a little--","sourceUid":"merged-mrar17nk-131","uid":"merged-mrar17nk-131","sourceNo":833,"originalSourceNo":833,"manualOrder":322,"workspaceFixedOrder":322,"lockedOrder":322,"orderLocked":true,"start":3223.96714,"end":3344.954976,"viRange":{"start":3223.96714,"end":3233.905112},"koRange":{"start":3336.246521,"end":3344.954976},"viRanges":[{"start":3223.96714,"end":3233.905112}],"koRanges":[{"start":3336.246521,"end":3344.954976}]},{"id":322,"readerNo":323,"displayNo":323,"n":323,"cueNo":323,"uniqueCueNo":323,"finalCueNo":323,"originalDisplayNo":323,"type":"narration","vi":"Ôi, con xin lỗi.\nTôi không có gì phải bận tâm đến chuyện hai đứa nhỏ kết hôn.","ko":"[서정] 죄송합니다 \n[우원의 웃음][우원] \n아, 이거. 결혼할 당사자 사이는 걱정이 안 되는데","en":"I apologize.\nI'm not worried about these two getting married.","text":"Ôi, con xin lỗi.\nTôi không có gì phải bận tâm đến chuyện hai đứa nhỏ kết hôn.\\n[서정] 죄송합니다 \n[우원의 웃음][우원] \n아, 이거. 결혼할 당사자 사이는 걱정이 안 되는데\\nI apologize.\nI'm not worried about these two getting married.","sourceUid":"merged-mrar2rmm-132","uid":"merged-mrar2rmm-132","sourceNo":836,"originalSourceNo":836,"manualOrder":323,"workspaceFixedOrder":323,"lockedOrder":323,"orderLocked":true,"start":3233.905112,"end":3359.345558,"viRange":{"start":3233.905112,"end":3247.314422},"koRange":{"start":3351.804928,"end":3359.345558},"viRanges":[{"start":3233.905112,"end":3247.314422}],"koRanges":[{"start":3351.804928,"end":3359.345558}]},{"id":323,"readerNo":324,"displayNo":324,"n":324,"cueNo":324,"uniqueCueNo":324,"finalCueNo":324,"originalDisplayNo":324,"type":"narration","vi":"Nhưng với sui gia thì hơi đáng ngại đó.\nHai đứa nó học cùng cấp một và cấp hai mà.\nChung cả trường đại học nữa nhỉ? Khác đấy ạ.\nMay là tụi cháu được chọn trường đại học.","ko":"이 시누이 사이가 걱정이 됩니다\n초중고 동창이었잖습니까\n[용호] 씁, 대학도 같은 데인가?\n대학은 다른데\n대학이야 원하는 데로 골라서 가니까요","en":"But I'm quite worried about the in-law.\nThey went to the same primary and secondary school.\nWas it also the same university? -No, different ones.\nThankfully, we get to choose universities.","text":"Nhưng với sui gia thì hơi đáng ngại đó.\nHai đứa nó học cùng cấp một và cấp hai mà.\nChung cả trường đại học nữa nhỉ? Khác đấy ạ.\nMay là tụi cháu được chọn trường đại học.\\n이 시누이 사이가 걱정이 됩니다\n초중고 동창이었잖습니까\n[용호] 씁, 대학도 같은 데인가?\n대학은 다른데\n대학이야 원하는 데로 골라서 가니까요\\nBut I'm quite worried about the in-law.\nThey went to the same primary and secondary school.\nWas it also the same university? -No, different ones.\nThankfully, we get to choose universities.","sourceUid":"merged-mrar4lue-134","uid":"merged-mrar4lue-134","sourceNo":841,"originalSourceNo":841,"manualOrder":324,"workspaceFixedOrder":324,"lockedOrder":324,"orderLocked":true,"start":3247.314422,"end":3369.928052,"viRange":{"start":3247.314422,"end":3257.992717},"koRange":{"start":3359.345558,"end":3369.928052},"viRanges":[{"start":3247.314422,"end":3257.992717}],"koRanges":[{"start":3359.345558,"end":3369.928052}]},{"id":324,"readerNo":325,"displayNo":325,"n":325,"cueNo":325,"uniqueCueNo":325,"finalCueNo":325,"originalDisplayNo":325,"type":"narration","vi":"Cậu đâu có được chọn. Điểm thấp quá mà.\nCòn cậu thì sao? Thôi nào, hai đứa.\nTụi nó quen nhau, lại còn giống nhau nên mới cãi nhau được.\nCứ cãi nhau tiếp đi.","ko":"네가 원하는 데로 갔냐? 점수 맞춰 갔지. 씨, 그러는 너는\n[용호] 씁, 어허, 좀 \n[근철의 말리는 소리]\n[근철] 아니까 싸우지 급이 맞으니까 싸우고\n계속 싸우라우","en":"You didn't get to choose. You had poor grades.\nWhat about you? Enough.\nThey squabble because they know each other and are similar.\nKeep the argument going.","text":"Cậu đâu có được chọn. Điểm thấp quá mà.\nCòn cậu thì sao? Thôi nào, hai đứa.\nTụi nó quen nhau, lại còn giống nhau nên mới cãi nhau được.\nCứ cãi nhau tiếp đi.\\n네가 원하는 데로 갔냐? 점수 맞춰 갔지. 씨, 그러는 너는\n[용호] 씁, 어허, 좀 \n[근철의 말리는 소리]\n[근철] 아니까 싸우지 급이 맞으니까 싸우고\n계속 싸우라우\\nYou didn't get to choose. You had poor grades.\nWhat about you? Enough.\nThey squabble because they know each other and are similar.\nKeep the argument going.","sourceUid":"merged-mrar7266-137","uid":"merged-mrar7266-137","sourceNo":734,"originalSourceNo":734,"manualOrder":325,"workspaceFixedOrder":325,"lockedOrder":325,"orderLocked":true,"start":3257.992717,"end":3381.758619,"viRange":{"start":3257.992717,"end":3269.794259},"koRange":{"start":3369.928052,"end":3381.758619},"viRanges":[{"start":3257.992717,"end":3269.794259}],"koRanges":[{"start":3369.928052,"end":3381.758619}]},{"id":325,"readerNo":326,"displayNo":326,"n":326,"cueNo":326,"uniqueCueNo":326,"finalCueNo":326,"originalDisplayNo":326,"type":"narration","vi":"Bên nào thắng là ông bênh. Cháu đích tôn. Vâng?\nCháu ăn nhiều vào mà chiến đấu. Vâng ạ.\nKhi nào chúng ta nên tổ chức hôn lễ?","ko":"이기는 편 우리 편이야. 장손. 네\n많이 먹어, 싸우려면\n[용호] 결혼식은 언제로 잡을까요?","en":"I'll be on the winner's team. Han-su. Yes?\nYou should eat up for the fight. Yes, sir.\nWhen should they get married?","text":"Bên nào thắng là ông bênh. Cháu đích tôn. Vâng?\nCháu ăn nhiều vào mà chiến đấu. Vâng ạ.\nKhi nào chúng ta nên tổ chức hôn lễ?\\n이기는 편 우리 편이야. 장손. 네\n많이 먹어, 싸우려면\n[용호] 결혼식은 언제로 잡을까요?\\nI'll be on the winner's team. Han-su. Yes?\nYou should eat up for the fight. Yes, sir.\nWhen should they get married?","sourceUid":"merged-mrar8ev0-139","uid":"merged-mrar8ev0-139","sourceNo":741,"originalSourceNo":741,"manualOrder":326,"workspaceFixedOrder":326,"lockedOrder":326,"orderLocked":true,"start":3269.794259,"end":3408.02809,"viRange":{"start":3269.794259,"end":3295.504554},"koRange":{"start":3381.758619,"end":3408.02809},"viRanges":[{"start":3269.794259,"end":3295.504554}],"koRanges":[{"start":3381.758619,"end":3408.02809}]},{"id":326,"readerNo":327,"displayNo":327,"n":327,"cueNo":327,"uniqueCueNo":327,"finalCueNo":327,"originalDisplayNo":327,"type":"narration","vi":"[Mọi người cười]","ko":"[사람들의 웃음]","en":"[People laughing]","text":"[Mọi người cười]\\n[사람들의 웃음]\\n[People laughing]","sourceUid":"ko-mr905eaf-1719","uid":"ko-mr905eaf-1719","sourceNo":848,"originalSourceNo":848,"manualOrder":327,"workspaceFixedOrder":327,"lockedOrder":327,"orderLocked":true,"start":3294.29,"end":3296.29,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":327,"readerNo":328,"displayNo":328,"n":328,"cueNo":328,"uniqueCueNo":328,"finalCueNo":328,"originalDisplayNo":328,"type":"narration","vi":"Càng sớm càng tốt. Tôi đồng ý.\nVới số cổ phần ông nắm giữ ở công ty tôi, mong ông sẽ hỗ trợ tôi.\nCòn số cổ phần ông nắm giữ ở công ty tôi, ông cũng hãy hỗ trợ tôi nhé. Tất nhiên rồi.","ko":"[우원] 아, 빨리 합쳐야죠\n[용호] 그렇죠?\n우원 회장님이 가진 저희 회사 지분으로\n제 편에 서 주시고\n강 회장님이 가지신 저희 회사 지분으로\n제 편에 서 주시면 아, 예 \n[웃음][우원의 웃음]","en":"As soon as possible. I agree. With the shares you hold in our company, you can support me. \nAnd with the shares you hold in our company, you can support me as well. Of course.","text":"Càng sớm càng tốt. Tôi đồng ý.\nVới số cổ phần ông nắm giữ ở công ty tôi, mong ông sẽ hỗ trợ tôi.\nCòn số cổ phần ông nắm giữ ở công ty tôi, ông cũng hãy hỗ trợ tôi nhé. Tất nhiên rồi.\\n[우원] 아, 빨리 합쳐야죠\n[용호] 그렇죠?\n우원 회장님이 가진 저희 회사 지분으로\n제 편에 서 주시고\n강 회장님이 가지신 저희 회사 지분으로\n제 편에 서 주시면 아, 예 \n[웃음][우원의 웃음]\\nAs soon as possible. I agree. With the shares you hold in our company, you can support me. \nAnd with the shares you hold in our company, you can support me as well. Of course.","sourceUid":"merged-mrargszf-145","uid":"merged-mrargszf-145","sourceNo":858,"originalSourceNo":858,"manualOrder":328,"workspaceFixedOrder":328,"lockedOrder":328,"orderLocked":true,"start":3295.504554,"end":3421.624053,"viRange":{"start":3295.504554,"end":3309.96888},"koRange":{"start":3408.02809,"end":3421.624053},"viRanges":[{"start":3295.504554,"end":3309.96888}],"koRanges":[{"start":3408.02809,"end":3421.624053}]},{"id":328,"readerNo":329,"displayNo":329,"n":329,"cueNo":329,"uniqueCueNo":329,"finalCueNo":329,"originalDisplayNo":329,"type":"narration","vi":"Có nhiều người cản trở việc vận hành công ty của tôi quá.","ko":"[용호] 아, 자꾸 이 경영에 간섭하는 것들이 많아서","en":"There are so many people that hinder me from running the company.","text":"Có nhiều người cản trở việc vận hành công ty của tôi quá.\\n[용호] 아, 자꾸 이 경영에 간섭하는 것들이 많아서\\nThere are so many people that hinder me from running the company.","sourceUid":"merged-mrargomm-144","uid":"merged-mrargomm-144","sourceNo":861,"originalSourceNo":861,"manualOrder":329,"workspaceFixedOrder":329,"lockedOrder":329,"orderLocked":true,"start":3309.96888,"end":3426.105516,"viRange":{"start":3309.96888,"end":3313.483601},"koRange":{"start":3421.624053,"end":3426.105516},"viRanges":[{"start":3309.96888,"end":3313.483601}],"koRanges":[{"start":3421.624053,"end":3426.105516}]},{"id":329,"readerNo":330,"displayNo":330,"n":330,"cueNo":330,"uniqueCueNo":330,"finalCueNo":330,"originalDisplayNo":330,"type":"narration","vi":"Thưa Chủ tịch. Sao? Ở đây sao?\nLỆNH BẮT GIỮ\nÔng đã vi phạm Luật Giao dịch Ngoại hối.","ko":"[비서] 회장님. 뭐? 여기로?\n[김 검사] 외국환 거래법 위반으로 영장 발부됐습니다","en":"Sir. What? Here?\nARREST WARRANT\nYou have violated the Foreign Exchange Transactions Act.","text":"Thưa Chủ tịch. Sao? Ở đây sao?\nLỆNH BẮT GIỮ\nÔng đã vi phạm Luật Giao dịch Ngoại hối.\\n[비서] 회장님. 뭐? 여기로?\n[김 검사] 외국환 거래법 위반으로 영장 발부됐습니다\\nSir. What? Here?\nARREST WARRANT\nYou have violated the Foreign Exchange Transactions Act.","sourceUid":"merged-mrari55h-146","uid":"merged-mrari55h-146","sourceNo":866,"originalSourceNo":866,"manualOrder":330,"workspaceFixedOrder":330,"lockedOrder":330,"orderLocked":true,"start":3313.483601,"end":3440.93921,"viRange":{"start":3313.483601,"end":3329.001776},"koRange":{"start":3426.105516,"end":3440.93921},"viRanges":[{"start":3313.483601,"end":3329.001776}],"koRanges":[{"start":3426.105516,"end":3440.93921}]},{"id":330,"readerNo":331,"displayNo":331,"n":331,"cueNo":331,"uniqueCueNo":331,"finalCueNo":331,"originalDisplayNo":331,"type":"narration","vi":"[âm nhạc đen tối]","ko":"[어두운 음악]","en":"[dark music]","text":"[âm nhạc đen tối]\\n[어두운 음악]\\n[dark music]","sourceUid":"ko-mr905eaf-1734","uid":"ko-mr905eaf-1734","sourceNo":863,"originalSourceNo":863,"manualOrder":331,"workspaceFixedOrder":331,"lockedOrder":331,"orderLocked":true,"start":3340.62,"end":3341.92,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":331,"readerNo":332,"displayNo":332,"n":332,"cueNo":332,"uniqueCueNo":332,"finalCueNo":332,"originalDisplayNo":332,"type":"narration","vi":"Mời ông đi theo chúng tôi.\nCác anh có nhất định phải đến vào giờ này, và đến tận đây không?","ko":"같이 가시죠\n[우원] 굳이 이 시간에 여기로 왔다?","en":"Please come with us.\nDid you have to come at this hour\nto this place?","text":"Mời ông đi theo chúng tôi.\nCác anh có nhất định phải đến vào giờ này, và đến tận đây không?\\n같이 가시죠\n[우원] 굳이 이 시간에 여기로 왔다?\\nPlease come with us.\nDid you have to come at this hour\nto this place?","sourceUid":"merged-mrarki2o-147","uid":"merged-mrarki2o-147","sourceNo":869,"originalSourceNo":869,"manualOrder":332,"workspaceFixedOrder":332,"lockedOrder":332,"orderLocked":true,"start":3329.001776,"end":3449.228748,"viRange":{"start":3329.001776,"end":3337.360975},"koRange":{"start":3440.93921,"end":3449.228748},"viRanges":[{"start":3329.001776,"end":3337.360975}],"koRanges":[{"start":3440.93921,"end":3449.228748}]},{"id":332,"readerNo":333,"displayNo":333,"n":333,"cueNo":333,"uniqueCueNo":333,"finalCueNo":333,"originalDisplayNo":333,"type":"narration","vi":"Các anh đang cố làm bẽ mặt tôi đấy à?\nThực thi công vụ thì đâu bị giới hạn giờ giấc và địa điểm.\nTôi nghĩ tạm thời ông nên đi, Chủ tịch.","ko":"대놓고 망신 주겠다 이거야?\n공무 집행에 시간과 장소가 따로 있습니까?\n일단은 가셔야 될 거 같습니다 회장님","en":"Are you trying to humiliate me?\nCarrying out an official duty\nisn't constrained by time and place.\nI think you should go for now, sir.","text":"Các anh đang cố làm bẽ mặt tôi đấy à?\nThực thi công vụ thì đâu bị giới hạn giờ giấc và địa điểm.\nTôi nghĩ tạm thời ông nên đi, Chủ tịch.\\n대놓고 망신 주겠다 이거야?\n공무 집행에 시간과 장소가 따로 있습니까?\n일단은 가셔야 될 거 같습니다 회장님\\nAre you trying to humiliate me?\nCarrying out an official duty\nisn't constrained by time and place.\nI think you should go for now, sir.","sourceUid":"merged-mrarlzva-149","uid":"merged-mrarlzva-149","sourceNo":761,"originalSourceNo":761,"manualOrder":333,"workspaceFixedOrder":333,"lockedOrder":333,"orderLocked":true,"start":3337.360975,"end":3467.755369,"viRange":{"start":3337.360975,"end":3354.97172},"koRange":{"start":3449.228748,"end":3467.755369},"viRanges":[{"start":3337.360975,"end":3354.97172}],"koRanges":[{"start":3449.228748,"end":3467.755369}]},{"id":333,"readerNo":334,"displayNo":334,"n":334,"cueNo":334,"uniqueCueNo":334,"finalCueNo":334,"originalDisplayNo":334,"type":"narration","vi":"Tôi xin lỗi vì đã gây ồn ào.\nChắc ông sẽ vất vả lắm đây.\nChúng tôi cũng sẽ giúp bằng mọi giá. Cảm ơn ông.","ko":"[우원] 시끄럽게 해서 죄송합니다\n골치 좀 썩으시겠네요\n[용호] 저희 쪽에서도 도울 일 있으면 돕겠습니다","en":"I'm sorry for all the commotion.\nThis must be hard for you.\nWe'll help however we can. Thank you.","text":"Tôi xin lỗi vì đã gây ồn ào.\nChắc ông sẽ vất vả lắm đây.\nChúng tôi cũng sẽ giúp bằng mọi giá. Cảm ơn ông.\\n[우원] 시끄럽게 해서 죄송합니다\n골치 좀 썩으시겠네요\n[용호] 저희 쪽에서도 도울 일 있으면 돕겠습니다\\nI'm sorry for all the commotion.\nThis must be hard for you.\nWe'll help however we can. Thank you.","sourceUid":"merged-mraro5w6-151","uid":"merged-mraro5w6-151","sourceNo":875,"originalSourceNo":875,"manualOrder":334,"workspaceFixedOrder":334,"lockedOrder":334,"orderLocked":true,"start":3354.97172,"end":3479.403079,"viRange":{"start":3354.97172,"end":3366.692008},"koRange":{"start":3467.755369,"end":3479.403079},"viRanges":[{"start":3354.97172,"end":3366.692008}],"koRanges":[{"start":3467.755369,"end":3479.403079}]},{"id":334,"readerNo":335,"displayNo":335,"n":335,"cueNo":335,"uniqueCueNo":335,"finalCueNo":335,"originalDisplayNo":335,"type":"narration","vi":"VĂN PHÒNG GIÁM ĐỐC DỰ ÁN","ko":"","en":"","text":"VĂN PHÒNG GIÁM ĐỐC DỰ ÁN","sourceUid":"vi-mr905aah-774","uid":"vi-mr905aah-774","sourceNo":774,"originalSourceNo":774,"manualOrder":335,"workspaceFixedOrder":335,"lockedOrder":335,"orderLocked":true,"start":3399.02,"end":3400.27,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[] {"id":337,"readerNo":338,"displayNo":338,"n":338,"cueNo":338,"uniqueCueNo":338,"finalCueNo":338,"originalDisplayNo":338,"type":"narration","vi":"Tôi cũng chả thể phản kháng vì cô ta nói đúng quá.\nTôi… sẽ xử lý việc này.","ko":"[임원3] 맞는 말만 하니까 반대할 수도 없고, 참 [쓴웃음]\n제가 해결하겠습니다","en":"I can't argue with her since she only states the facts.\nI will… take care of it.","text":"Tôi cũng chả thể phản kháng vì cô ta nói đúng quá.\nTôi… sẽ xử lý việc này.\\n[임원3] 맞는 말만 하니까 반대할 수도 없고, 참 [쓴웃음]\n제가 해결하겠습니다\\nI can't argue with her since she only states the facts.\nI will… take care of it.","sourceUid":"merged-mrars0pr-156","uid":"merged-mrars0pr-156","sourceNo":882,"originalSourceNo":882,"manualOrder":338,"workspaceFixedOrder":338,"lockedOrder":338,"orderLocked":true,"start":3396.593674,"end":3519.110601,"viRange":{"start":3396.593674,"end":3407.322909},"koRange":{"start":3508.383401,"end":3519.110601},"viRanges":[{"start":3396.593674,"end":3407.322909}],"koRanges":[{"start":3508.383401,"end":3519.110601}]},{"id":338,"readerNo":339,"displayNo":339,"n":339,"cueNo":339,"uniqueCueNo":339,"finalCueNo":339,"originalDisplayNo":339,"type":"narration","vi":"Với lại, sao các anh lại ngây thơ vậy?\nCác anh nghĩ Giám đốc Go làm vậy vì công ty sao?\nCô ta làm vậy để lôi kéo người về phe mình thôi.","ko":"[창수] 그리고\n왜들 이렇게 순진들 하십니까?\n고 상무가 회사 위해서 저러는 거 같습니까?\n지 편 만들려고 저러는 거지","en":"Also, why are you all so naive?\nYou think Director Go is doing that for the company?\nThis is her attempt to bring people to her side.","text":"Với lại, sao các anh lại ngây thơ vậy?\nCác anh nghĩ Giám đốc Go làm vậy vì công ty sao?\nCô ta làm vậy để lôi kéo người về phe mình thôi.\\n[창수] 그리고\n왜들 이렇게 순진들 하십니까?\n고 상무가 회사 위해서 저러는 거 같습니까?\n지 편 만들려고 저러는 거지\\nAlso, why are you all so naive?\nYou think Director Go is doing that for the company?\nThis is her attempt to bring people to her side.","sourceUid":"merged-mrartau7-158","uid":"merged-mrartau7-158","sourceNo":887,"originalSourceNo":887,"manualOrder":339,"workspaceFixedOrder":339,"lockedOrder":339,"orderLocked":true,"start":3407.322909,"end":3532.080405,"viRange":{"start":3407.322909,"end":3420.450903},"koRange":{"start":3519.110601,"end":3532.080405},"viRanges":[{"start":3407.322909,"end":3420.450903}],"koRanges":[{"start":3519.110601,"end":3532.080405}]},{"id":339,"readerNo":340,"displayNo":340,"n":340,"cueNo":340,"uniqueCueNo":340,"finalCueNo":340,"originalDisplayNo":340,"type":"narration","vi":"Anh nói vậy là sao?\nCái đó gọi là \"chia để trị\".\nBắt đầu tạo phe cho riêng mình là vừa rồi.","ko":"무슨 말씀이세요?\n디바이드 앤 룰 아닙니까\n[아인] 이제 슬슬 내 편 좀 만들어 볼까?","en":"What do you mean?\nIt's called \"divide and rule.\"\nIt's time to bring people onto my side.","text":"Anh nói vậy là sao?\nCái đó gọi là \"chia để trị\".\nBắt đầu tạo phe cho riêng mình là vừa rồi.\\n무슨 말씀이세요?\n디바이드 앤 룰 아닙니까\n[아인] 이제 슬슬 내 편 좀 만들어 볼까?\\nWhat do you mean?\nIt's called \"divide and rule.\"\nIt's time to bring people onto my side.","sourceUid":"merged-mraruejn-159","uid":"merged-mraruejn-159","sourceNo":890,"originalSourceNo":890,"manualOrder":340,"workspaceFixedOrder":340,"lockedOrder":340,"orderLocked":true,"start":3420.450903,"end":3544.029991,"viRange":{"start":3420.450903,"end":3431.962196},"koRange":{"start":3532.080405,"end":3544.029991},"viRanges":[{"start":3420.450903,"end":3431.962196}],"koRanges":[{"start":3532.080405,"end":3544.029991}]},{"id":340,"readerNo":341,"displayNo":341,"n":341,"cueNo":341,"uniqueCueNo":341,"finalCueNo":341,"originalDisplayNo":341,"type":"narration","vi":"Cô ta đang cố chia rẽ và kéo một nửa nhân sự về phe mình.\nAnh biết rồi mà vẫn để việc này xảy ra sao?","ko":"[창수] 내부에 대립을 만들어서 절반은 확실하게 자기편을 만들겠다.\n그걸 아는 분이 일을 이렇게 만듭니까?","en":"She's trying to divide them up and bring half of them onto her side.\nYou knew, but you still let this happen?","text":"Cô ta đang cố chia rẽ và kéo một nửa nhân sự về phe mình.\nAnh biết rồi mà vẫn để việc này xảy ra sao?\\n[창수] 내부에 대립을 만들어서 절반은 확실하게 자기편을 만들겠다.\n그걸 아는 분이 일을 이렇게 만듭니까?\\nShe's trying m các vị chứng tỏ bản thân. Nhưng tôi chỉ thấy mỗi điểm yếu. \nTạm biệt.","ko":"실력 보여 주길 한참이나 기다렸는데 단점만 봤네요. \n굿바이","en":"I've waited a long time for you to prove yourself. But I only saw the faults.\nBye","text":"Tôi đã chờ rất lâu để xem các vị chứng tỏ bản thân. Nhưng tôi chỉ thấy mỗi điểm yếu. \nTạm biệt.\\n실력 보여 주길 한참이나 기다렸는데 단점만 봤네요. \n굿바이\\nI've waited a long time for you to prove yourself. But I only saw the faults.\nBye","sourceUid":"merged-mrasagvm-173","uid":"merged-mrasagvm-173","sourceNo":924,"originalSourceNo":924,"manualOrder":353,"workspaceFixedOrder":353,"lockedOrder":353,"orderLocked":true,"start":3549.391697,"end":3667.666822,"viRange":{"start":3549.391697,"end":3556.131305},"koRange":{"start":3661.557051,"end":3667.666822},"viRanges":[{"start":3549.391697,"end":3556.131305}],"koRanges":[{"start":3661.557051,"end":3667.666822}]},{"id":353,"readerNo":354,"displayNo":354,"n":354,"cueNo":354,"uniqueCueNo":354,"finalCueNo":354,"originalDisplayNo":354,"type":"narration","vi":"Giám đốc Choi. Cô ta vừa tan làm rồi.\nNHỮNG NGƯỜI PHẢI CHỜ ĐỢI HAY NGHĨ VỀ ĐIỂM YẾU CỦA KẺ BẮT HỌ ĐỢI\nNội dung hay đấy. \nĐể tôi đi xác minh nội dung này đã.","ko":"상무님 [차 부장] 방금 퇴근했답니다\n카피 좋네. \n요 카피 컨펌 좀 해 주고 올게","en":"Mr. Choi. She just got off work.\nTHOSE WHO WAIT THINK ABOUT THE FAULTS OF THOSE THAT MADE THEM WAIT.\nWhat a good copy. \nLet me get this copy confirmed.","text":"Giám đốc Choi. Cô ta vừa tan làm rồi.\nNHỮNG NGƯỜI PHẢI CHỜ ĐỢI HAY NGHĨ VỀ ĐIỂM YẾU CỦA KẺ BẮT HỌ ĐỢI\nNội dung hay đấy. \nĐể tôi đi xác minh nội dung này đã.\\n상무님 [차 부장] 방금 퇴근했답니다\n카피 좋네. \n요 카피 컨펌 좀 해 주고 올게\\nMr. Choi. She just got off work.\nTHOSE WHO WAIT THINK ABOUT THE FAULTS OF THOSE THAT MADE THEM WAIT.\nWhat a good copy. \nLet me get this copy confirmed.","sourceUid":"merged-mrasdo9h-175","uid":"merged-mrasdo9h-175","sourceNo":808,"originalSourceNo":808,"manualOrder":354,"workspaceFixedOrder":354,"lockedOrder":354,"orderLocked":true,"start":3556.131305,"end":3690.045053,"viRange":{"start":3
