 bị kích động, con người rất dễ mắc sai lầm.\\n장난하냐? 놀리는 거야?\n[아인] 흥분하셨네요. 사람은 흥분하면 실수하니까\\nAre you kidding me? You think this is funny?\nYou're worked up. When people get worked up, they make mistakes.","sourceUid":"merged-mrasi7ie-178","uid":"merged-mrasi7ie-178","sourceNo":934,"originalSourceNo":934,"manualOrder":357,"workspaceFixedOrder":357,"lockedOrder":357,"orderLocked":true,"start":3603,"end":3727.011221,"viRange":{"start":3603,"end":3615.032541},"koRange":{"start":3714,"end":3727.011221},"viRanges":[{"start":3603,"end":3615.032541}],"koRanges":[{"start":3714,"end":3727.011221}]},{"id":357,"readerNo":358,"displayNo":358,"n":358,"cueNo":358,"uniqueCueNo":358,"finalCueNo":358,"originalDisplayNo":358,"type":"narration","vi":"Khi nào anh bình tĩnh lại, chúng ta nói chuyện sau nhé?\nKhi bị kích động, con người rất dễ mắc sai lầm.\nKhi nào cô bình tĩnh lại, chúng ta sẽ nói chuyện sau.","ko":"흥분 가라앉으면 그때 다시 얘기하실까요?\n[창수] 사람은 흥분하면 실수해\n흥분 가라앉으면 그때 다시 얘기하자","en":"Should we talk again when you have calmed down?\nWhen people get worked up, they make mistakes.\nLet's talk again when you have calmed down.","text":"Khi nào anh bình tĩnh lại, chúng ta nói chuyện sau nhé?\nKhi bị kích động, con người rất dễ mắc sai lầm.\nKhi nào cô bình tĩnh lại, chúng ta sẽ nói chuyện sau.\\n흥분 가라앉으면 그때 다시 얘기하실까요?\n[창수] 사람은 흥분하면 실수해\n흥분 가라앉으면 그때 다시 얘기하자\\nShould we talk again when you have calmed down?\nWhen people get worked up, they make mistakes.\nLet's talk again when you have calmed down.","sourceUid":"merged-mraskjsi-179","uid":"merged-mraskjsi-179","sourceNo":937,"originalSourceNo":937,"manualOrder":358,"workspaceFixedOrder":358,"lockedOrder":358,"orderLocked":true,"start":3615.032541,"end":3737.451272,"viRange":{"start":3615.032541,"end":3625.37198},"koRange":{"start":3727.011221,"end":3737.451272},"viRanges":[{"start":3615.032541,"end":3625.37198}],"koRanges":[{"start":3727.011221,"end":3737.451272}]},{"id":358,"readerNo":359,"displayNo":359,"n":359,"cueNo":359,"uniqueCueNo":359,"finalCueNo":359,"originalDisplayNo":359,"type":"narration","vi":"Cô muốn đối đầu?\nMuốn khiêu chiến tôi sao?\nKhông ngờ có ngày anh để lộ cảm xúc ở công ty.","ko":"[창수] 막가자는 거야?\n한번 해보자는 거냐고\n상무님이 회사에서 얼굴 붉히실 때도 있네요?","en":"So you want to play?\nAre you starting a fight with me?\nI never knew you'd show your emotions at work.","text":"Cô muốn đối đầu?\nMuốn khiêu chiến tôi sao?\nKhông ngờ có ngày anh để lộ cảm xúc ở công ty.\\n[창수] 막가자는 거야?\n한번 해보자는 거냐고\n상무님이 회사에서 얼굴 붉히실 때도 있네요?\\nSo you want to play?\nAre you starting a fight with me?\nI never knew you'd show your emotions at work.","sourceUid":"merged-mrasllqb-181","uid":"merged-mrasllqb-181","sourceNo":819,"originalSourceNo":819,"manualOrder":359,"workspaceFixedOrder":359,"lockedOrder":359,"orderLocked":true,"start":3625.37198,"end":3750.05973,"viRange":{"start":3625.37198,"end":3638.3},"koRange":{"start":3741.671499,"end":3750.05973},"viRanges":[{"start":3625.37198,"end":3638.3}],"koRanges":[{"start":3741.671499,"end":3750.05973}]},{"id":359,"readerNo":360,"displayNo":360,"n":360,"cueNo":360,"uniqueCueNo":360,"finalCueNo":360,"originalDisplayNo":360,"type":"narration","vi":"Tôi quyết định sẽ làm vậy với cô.\nĐược thôi, anh cố lên nhé.\nCô… Phải rồi.","ko":"너한텐 그러기로 했어\n네, 파이팅 하세요\n[창수] 아이씨…\n[아인] 아, 맞다","en":"I decided that I would to you.\nSure, good luck with that.\nYou… That's right.","text":"Tôi quyết định sẽ làm vậy với cô.\nĐược thôi, anh cố lên nhé.\nCô… Phải rồi.\\n너한텐 그러기로 했어\n네, 파이팅 하세요\n[창수] 아이씨…\n[아인] 아, 맞다\\nI decided that I would to you.\nSure, good luck with that.\nYou… That's right.","sourceUid":"merged-mrasnkqe-182","uid":"merged-mrasnkqe-182","sourceNo":830,"originalSourceNo":830,"manualOrder":360,"workspaceFixedOrder":360,"lockedOrder":360,"orderLocked":true,"start":3638.3,"end":3758.627893,"viRange":{"start":3638.3,"end":3646.841354},"koRange":{"start":3750.05973,"end":3758.627893},"viRanges":[{"start":3638.3,"end":3646.841354}],"koRanges":[{"start":3750.05973,"end":3758.627893}]},{"id":360,"readerNo":361,"displayNo":361,"n":361,"cueNo":361,"uniqueCueNo":361,"finalCueNo":361,"originalDisplayNo":361,"type":"narration","vi":"Phải làm sao đây?\nTôi đã cố bắt kịp anh, nhưng tôi không tự đào hố chôn mình…","ko":"어떡하지? 상무님 따라가려다 보니까\n이 예쁜 다리 사이에 달린 가랑이가 아니라","en":"This is bad.\nI tried to keep up with you, Mr. Choi, and I didn't end up digging my own grave…","text":"Phải làm sao đây?\nTôi đã cố bắt kịp anh, nhưng tôi không tự đào hố chôn mình…\\n어떡하지? 상무님 따라가려다 보니까\n이 예쁜 다리 사이에 달린 가랑이가 아니라\\nThis is bad.\nI tried to keep up with you, Mr. Choi, and I didn't end up digging my own grave…","sourceUid":"merged-mrasopri-183","uid":"merged-mrasopri-183","sourceNo":948,"originalSourceNo":948,"manualOrder":361,"workspaceFixedOrder":361,"lockedOrder":361,"orderLocked":true,"start":3646.841354,"end":3770.525217,"viRange":{"start":3646.841354,"end":3662.231066},"koRange":{"start":3758.627893,"end":3770.525217},"viRanges":[{"start":3646.841354,"end":3662.231066}],"koRanges":[{"start":3758.627893,"end":3770.525217}]},{"id":361,"readerNo":362,"displayNo":362,"n":362,"cueNo":362,"uniqueCueNo":362,"finalCueNo":362,"originalDisplayNo":362,"type":"narration","vi":"mà chỉ làm đứt tay thôi. Đáng tiếc quá.\nTrên bàn tay xinh đẹp này sẽ có sẹo.","ko":"손이 찢어졌네요? 어떡하지?\n이 예쁜 손바닥에 흉터가 남았는데","en":"but I cut my hand instead. What a shame.\nMy beautiful hand is going to have a scar.","text":"mà chỉ làm đứt tay thôi. Đáng tiếc quá.\nTrên bàn tay xinh đẹp này sẽ có sẹo.\\n손이 찢어졌네요? 어떡하지?\n이 예쁜 손바닥에 흉터가 남았는데\\nbut I cut my hand instead. What a shame.\nMy beautiful hand is going to have a scar.","sourceUid":"merged-mraspsht-184","uid":"merged-mraspsht-184","sourceNo":951,"originalSourceNo":951,"manualOrder":362,"workspaceFixedOrder":362,"lockedOrder":362,"orderLocked":true,"start":3662.231066,"end":3783.450868,"viRange":{"start":3662.231066,"end":3671.530272},"koRange":{"start":3775.073426,"end":3783.450868},"viRanges":[{"start":3662.231066,"end":3671.530272}],"koRanges":[{"start":3775.073426,"end":3783.450868}]},{"id":362,"readerNo":363,"displayNo":363,"n":363,"cueNo":363,"uniqueCueNo":363,"finalCueNo":363,"originalDisplayNo":363,"type":"narration","vi":"Thì bôi thuốc vào.\nVết thương có thể sẽ nhanh lành, nhưng sẽ cần nhiều thời gian","ko":"약 발라\n상처는 금방 아물지만 흉터는 사라지려면 시간이 좀 걸리죠?","en":"Apply ointment.\nA wound may heal quickly, but for a scar to disappear,","text":"Thì bôi thuốc vào.\nVết thương có thể sẽ nhanh lành, nhưng sẽ cần nhiều thời gian\\n약 발라\n상처는 금방 아물지만 흉터는 사라지려면 시간이 좀 걸리죠?\\nApply ointment.\nA wound may heal quickly, but for a scar to disappear,","sourceUid":"merged-mrasr86x-185","uid":"merged-mrasr86x-185","sourceNo":954,"originalSourceNo":954,"manualOrder":363,"workspaceFixedOrder":363,"lockedOrder":363,"orderLocked":true,"start":3671.530272,"end":3794.159259,"viRange":{"start":3671.530272,"end":3681.916549},"koRange":{"start":3783.450868,"end":3794.159259},"viRanges":[{"start":3671.530272,"end":3681.916549}],"koRanges":[{"start":3783.450868,"end":3794.159259}]},{"id":363,"readerNo":364,"displayNo":364,"n":364,"cueNo":364,"uniqueCueNo":364,"finalCueNo":364,"originalDisplayNo":364,"type":"narration","vi":"để vết sẹo biến mất. Chắc cũng phải… cỡ một năm? \nTôi sẽ phải ngắm vết sẹo gớm ghiếc này mỗi ngày.\nKhông lâu đến vậy đâu.","ko":"한 1년쯤?\n[아인] 그때까지 이 끔찍한 걸 매일 보고 살아야겠네\n그렇게나 오래 걸리겠어?","en":"it takes quite a while. Maybe… about a year?\nI'll have to look at this hideous scar until then.\nIt won't take that long.","text":"để vết sẹo biến mất. Chắc cũng phải… cỡ một năm? \nTôi sẽ phải ngắm vết sẹo gớm ghiếc này mỗi ngày.\nKhông lâu đến vậy đâu.\\n한 1년쯤?\n[아인] 그때까지 이 끔찍한 걸 매일 보고 살아야겠네\n그렇게나 오래 걸리겠어?\\nit takes quite a while. Maybe… about a year?\nI'll have to look at this hideous scar until then.\nIt won't take that long.","sourceUid":"merged-mrastmv8-188","uid":"merged-mrastmv8-188","sourceNo":836,"originalSourceNo":836,"manualOrder":364,"workspaceFixedOrder":364,"lockedOrder":364,"orderLocked":true,"start":3681.916549,"end":3812.128617,"viRange":{"start":3681.916549,"end":3700.048441},"koRange":{"start":3794.159259,"end":3812.128617},"viRanges":[{"start":3681.916549,"end":3700.048441}],"koRanges":[{"start":3794.159259,"end":3812.128617}]},{"id":364,"readerNo":365,"displayNo":365,"n":365,"cueNo":365,"uniqueCueNo":365,"finalCueNo":365,"originalDisplayNo":365,"type":"narration","vi":"[Âm nhạc ý nghĩa]","ko":"[의미심장한 음악]","en":"[Meaningful music]","text":"[Âm nhạc ý nghĩa]\\n[의미심장한 음악]\\n[Meaningful music]","sourceUid":"ko-mr905eaf-1827","uid":"ko-mr905eaf-1827","sourceNo":956,"originalSourceNo":956,"manualOrder":365,"workspaceFixedOrder":365,"lockedOrder":365,"orderLocked":true,"start":3709.41,"end":3711.54,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[]},{"id":365,"readerNo":366,"displayNo":366,"n":366,"cueNo":366,"uniqueCueNo":366,"finalCueNo":366,"originalDisplayNo":366,"type":"narration","vi":"Cô cứ quên luôn đi.\nLàm sao mà quên được?\nVì nhớ dai nên tôi mới có vị trí này.","ko":"빨리 잊어\n잊혀지겠어요?\n머리 좋아서 여기까지 올라왔는데","en":"Just forget about it.\nIt's hard to forget.\nI made it this far because I don't forget.","text":"Cô cứ quên luôn đi.\nLàm sao mà quên được?\nVì nhớ dai nên tôi mới có vị trí này.\\n빨리 잊어\n잊혀지겠어요?\n머리 좋아서 여기까지 올라왔는데\\nJust forget about it.\nIt's hard to forget.\nI made it this far because I don't forget.","sourceUid":"merged-mrasujkg-189","uid":"merged-mrasujkg-189","sourceNo":962,"originalSourceNo":962,"manualOrder":366,"workspaceFixedOrder":366,"lockedOrder":366,"orderLocked":true,"start":3700.048441,"end":3817.760772,"viRange":{"start":3700.048441,"end":3706.579053},"koRange":{"start":3812.128617,"end":3817.760772},"viRanges":[{"start":3700.048441,"end":3706.579053}],"koRanges":[{"start":3812.128617,"end":3817.760772}]},{"id":366,"readerNo":367,"displayNo":367,"n":367,"cueNo":367,"uniqueCueNo":367,"finalCueNo":367,"originalDisplayNo":368,"type":"narration","vi":"Khi trời nổi cơn bão, anh sẽ nhận ra sự khác biệt giữa bông hoa trong nhà kính và hoa dại ven đường.","ko":"비바람 불면 알게 돼요\n하우스에서 곱게 자란 꽃과\n길바닥에서 자란 들꽃의 차이를","en":"When there's a storm, you realize the difference between a sheltered flower and a wildflower.","text":"Khi trời nổi cơn bão, anh sẽ nhận ra sự khác biệt giữa bông hoa trong nhà kính và hoa dại ven đường.\\n비바람 불면 알게 돼요\n하우스에서 곱게 자란 꽃과\n길바닥에서 자란 들꽃의 차이를\\nWhen there's a storm, you realize the difference between a sheltered flower and a wildflower.","sourceUid":"merged-mrasvdfx-190","uid":"merged-mrasvdfx-190","sourceNo":965,"originalSourceNo":965,"manualOrder":367,"workspaceFixedOrder":367,"lockedOrder":367,"orderLocked":true,"start":3706.579053,"end":3832.949541,"viRange":{"start":3706.579053,"end":3720.989937},"koRange":{"start":3823.590341,"end":3832.949541},"viRanges":[{"start":3706.579053,"end":3720.989937}],"koRanges":[{"start":3823.590341,"end":3832.949541}]},{"id":367,"readerNo":368,"displayNo":368,"n":368,"cueNo":368,"uniqueCueNo":368,"finalCueNo":368,"originalDisplayNo":369,"type":"narration","vi":"Cái gì? Anh hãy đợi đi. \nTôi sẽ gửi cho anh một cơn bão đến khuấy đảo tinh thần nhu nhược của anh.","ko":"뭐? [아인] 기다리세요.\n곱게 자란 그 멘털에 비바람 몰아쳐 드릴 테니까","en":"What? You'll see. \nI'll send a storm into that feeble and spoiled mind of yours.","text":"Cái gì? Anh hãy đợi đi. \nTôi sẽ gửi cho anh một cơn bão đến khuấy đảo tinh thần nhu nhược của anh.\\n뭐? [아인] 기다리세요.\n곱게 자란 그 멘털에 비바람 몰아쳐 드릴 테니까\\nWhat? You'll see. \nI'll send a storm into that feeble and spoiled mind of yours.","sourceUid":"merged-mraswpkt-191","uid":"merged-mraswpkt-191","sourceNo":970,"originalSourceNo":970,"manualOrder":368,"workspaceFixedOrder":368,"lockedOrder":368,"orderLocked":true,"start":3720.989937,"end":3847.978657,"viRange":{"start":3720.989937,"end":3731.496966},"koRange":{"start":3832.949541,"end":3847.978657},"viRanges":[{"start":3720.989937,"end":3731.496966}],"koRanges":[{"start":3832.949541,"end":3847.978657}]},{"id":368,"readerNo":369,"displayNo":369,"n":369,"cueNo":369,"uniqueCueNo":369,"finalCueNo":369,"originalDisplayNo":370,"type":"narration","vi":"[Âm nhạc cảm xúc]","ko":"[감성적인 음악]","en":"[Emotional music]","text":"[Âm nhạc cảm xúc]\\n[감성적인 음악]\\n[Emotional music]","sourceUid":"ko-mr905eag-1840","uid":"ko-mr905eag-1840","sourceNo":969,"originalSourceNo":969,"manualOrder":369,"workspaceFixedOrder":369,"lockedOrder":369,"orderLocked":true,"start":3847.978657,"end":3882.257,"viRange":null,"koRange":{"start":3847.978657,"end":3882.257},"viRanges":[],"koRanges":[{"start":3847.978657,"end":3882.257}]},{"id":369,"readerNo":370,"displayNo":370,"n":370,"cueNo":370,"uniqueCueNo":370,"finalCueNo":370,"originalDisplayNo":371,"type":"narration","vi":"Họ nổi dậy rồi.\nĐây là bản kiến nghị sa thải cô.\nLá bài của tôi thế nào?\nKém cỏi không thể tả.","ko":"[병수] 들고일어났습니다\n[우철] 상무님 해고 결의안입니다\n[창수] 어때? 내 카드가?\n[한나] 후지다, 진짜 후져\n[아인] 차원이 다른 사람에게 뒷정리시킬 거야","en":"They're protesting.\nIt's a petition for your resignation.\nHow do you like my move?\nIt's so lousy.","text":"Họ nổi dậy rồi.\nĐây là bản kiến nghị sa thải cô.\nLá bài của tôi thế nào?\nKém cỏi không thể tả.\\n[병수] 들고일어났습니다\n[우철] 상무님 해고 결의안입니다\n[창수] 어때? 내 카드가?\n[한나] 후지다, 진짜 후져\n[아인] 차원이 다른 사람에게 뒷정리시킬 거야\\nThey're protesting.\nIt's a petition for your resignation.\nHow do you like my move?\nIt's so lousy.","sourceUid":"merged-mrasymc5-192","uid":"merged-mrasymc5-192","sourceNo":974,"originalSourceNo":974,"manualOrder":370,"workspaceFixedOrder":370,"lockedOrder":370,"orderLocked":true,"start":3731.496966,"end":3891.965844,"viRange":{"start":3731.496966,"end":3766.955},"koRange":{"start":3882.257,"end":3891.965844},"viRanges":[{"start":3731.496966,"end":3766.955}],"koRanges":[{"start":3882.257,"end":3891.965844}]},{"id":370,"readerNo":371,"displayNo":371,"n":371,"cueNo":371,"uniqueCueNo":371,"finalCueNo":371,"originalDisplayNo":372,"type":"narration","vi":"Tôi sẽ khiến một người ở góc độ khác thu dọn việc này.\nĐừng xem thường Kang Han Na chỉ vì cô ta tỏ ra dễ gần.\nPhải chào đón cô ta thật nồng nhiệt.\nQuả bom hạt nhân này là sao?\nTuyệt đối không được.\nGiám đốc Choi có vẻ không biết…\nẢ điên đó…\n…một cơn bão lớn đến độ thổi bay được nhà kính\nsắp ập đến đây.","ko":"[태완] 강한나 겉으로 실실거린다고 쉽게 보지 마\n[창수] 성대하게 환영해 드려야지\n[은정] 이 무슨 핵폭탄을…\n[병수] 절대 안 됩니다\n[아인] 최 상무님이 잘 모르시더라고","en":"I'm going to have someone on another level handle this.\nDon't take Han-na lightly because she's easygoing on the outside.\nWe should give her a warm welcome.\nWhat is this mess?\nYou can't do that.\nMr. Choi doesn't seem to know…\nThat crazy…\n…that there is a storm strong enough\nto blow a house away.","text":"Tôi sẽ khiến một người ở góc độ khác thu dọn việc này.\nĐừng xem thường Kang Han Na chỉ vì cô ta tỏ ra dễ gần.\nPhải chào đón cô ta thật nồng nhiệt.\nQuả bom hạt nhân này là sao?\nTuyệt đối không được.\nGiám đốc Choi có vẻ không biết…\nẢ điên đó…\n…một cơn bão lớn đến độ thổi bay được nhà kính\nsắp ập đến đây.\\n[태완] 강한나 겉으로 실실거린다고 쉽게 보지 마\n[창수] 성대하게 환영해 드려야지\n[은정] 이 무슨 핵폭탄을…\n[병수] 절대 안 됩니다\n[아인] 최 상무님이 잘 모르시더라고\\nI'm going to have someone on another level handle this.\nDon't take Han-na lightly because she's easygoing on the outside.\nWe should give her a warm welcome.\nWhat is this mess?\nYou can't do that.\nMr. Choi doesn't seem to know…\nThat crazy…\n…that there is a storm strong enough\nto blow a house away.","sourceUid":"merged-mrat1m31-193","uid":"merged-mrat1m31-193","sourceNo":862,"originalSourceNo":862,"manualOrder":371,"workspaceFixedOrder":371,"lockedOrder":371,"orderLocked":true,"start":3892.228781,"end":3903.093,"viRange":null,"koRange":{"start":3892.228781,"end":3903.093},"viRanges":[],"koRanges":[{"start":3892.228781,"end":3903.093}]},{"id":371,"readerNo":372,"displayNo":372,"n":372,"cueNo":372,"uniqueCueNo":372,"finalCueNo":372,"originalDisplayNo":373,"type":"dialogue","vi":"Biên dịch: Nguyễn Phương Hà","ko":"","en":"Subtitle translation by: Jea-heon Chung","text":"Biên dịch: Nguyễn Phương Hà\\nSubtitle translation by: Jea-heon Chung","sourceUid":"merged-mrat1q5p-194","uid":"merged-mrat1q5p-194","sourceNo":861,"origi $('viaf').onchange=e=>{let f=e.target.files[0];if(f){via.src=URL.createObjectURL(f);applyVisibleVolume('vi');if(!engine.src){engine.src=via.src;engineKind='vi';applyEngineVolume('vi')}unlocked=false;setMsg('Đã chọn VI audio. Nếu dùng iPhone, bấm Unlock.')}};
$('koaf').onchange=e=>{let f=e.target.files[0];if(f){koa.src=URL.createObjectURL(f);applyVisibleVolume('ko');unlocked=false;setMsg('Đã chọn KO audio. Nếu dùng iPhone, bấm Unlock.')}};
function tryAuto(){let vu=candidateUrls('vi')[0], ku=candidateUrls('ko')[0]; if(vu)via.src=vu; if(ku)koa.src=ku; applyVisibleVolume('vi');applyVisibleVolume('ko'); try{via.load();koa.load();}catch(e){} setMsg('Đã khai báo audio từ GitHub. Nếu iPhone chưa nghe, chờ vài giây rồi bấm Unlock/Smart Flow.')}initReaderVolumeControls();tryAuto();
(function addIphoneButtons(){let row=document.querySelector('.float .row');if(row){let b=document.createElement('button');b.textContent='Unlock iPhone Audio';b.className='warn';b.onclick=()=>unlockAudio(true);row.insertBefore(b,row.children[3]||null);let d=document.createElement('button');d.textContent='Audio paths';d.onclick=()=>showAudioPaths();row.appendChild(d);}})();
render();</script></body></html>
